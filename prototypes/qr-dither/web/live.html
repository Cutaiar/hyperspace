<!doctype html>
<meta charset="utf-8">
<title>QR dither — live</title>
<style>
  :root { --red:#ff2b2b; --dim:rgba(255,255,255,.42); --line:rgba(255,255,255,.14);
          --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#000; color:#fff; font-family:var(--mono); }
  body { min-height:100svh; display:flex; align-items:center; justify-content:center;
         gap:40px; padding:32px 20px; flex-wrap:wrap; }
  h1 { margin:0 0 18px; font-size:12px; font-weight:500; letter-spacing:.3em;
       text-transform:uppercase; color:var(--red); }
  .left { display:flex; flex-direction:column; align-items:center; gap:16px; }
  #stage { touch-action:none; cursor:grab; line-height:0; border-radius:8px; background:#fff; }
  #stage.grabbing { cursor:grabbing; }
  canvas { display:block; border-radius:8px; width:420px; height:420px; }
  @media (max-width:900px){ canvas{ width:min(86vw,420px); height:min(86vw,420px); } }
  .row { display:flex; gap:18px; font-size:11px; color:var(--dim); letter-spacing:.04em;
         flex-wrap:wrap; justify-content:center; }
  .row b { color:#fff; font-weight:500; font-variant-numeric:tabular-nums; }
  .ok { color:#6ee7a8; }
  .panel { width:290px; display:flex; flex-direction:column; gap:4px; }
  .grp { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.2em;
         margin:16px 0 8px; border-top:1px solid var(--line); padding-top:12px; }
  .grp:first-of-type { margin-top:0; border-top:0; padding-top:0; }
  label.ctl { display:grid; grid-template-columns:42px 1fr 52px; gap:10px; align-items:center;
              font-size:11px; color:var(--dim); margin-bottom:7px; }
  label.ctl span:last-child { color:#fff; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { -webkit-appearance:none; appearance:none; height:2px; background:var(--line);
                      border-radius:2px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:11px; height:11px;
      border-radius:50%; background:var(--red); cursor:pointer; }
  .seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { flex:1; background:transparent; border:0; color:var(--dim); font:inherit;
                font-size:10.5px; padding:8px 4px; cursor:pointer; letter-spacing:.04em; }
  .seg button.on { background:var(--red); color:#000; font-weight:600; }
  .btns { display:flex; gap:8px; margin-top:14px; }
  .btns button { flex:1; background:transparent; border:1px solid var(--line); color:var(--dim);
                 font:inherit; font-size:10.5px; padding:8px; border-radius:6px; cursor:pointer; }
  .btns button:hover { border-color:var(--red); color:var(--red); }
  .note { font-size:10.5px; color:var(--dim); line-height:1.8; margin:14px 0 0; }
</style>

<div class="left">
  <h1>QR dither · live</h1>
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="row">
    <span>solve <b id="ms">—</b></span>
    <span>drawn <b id="hit">—</b></span>
    <span>update <b id="hz">—</b></span>
    <span class="ok">valid by construction</span>
  </div>
  <div class="row" id="angles"></div>
</div>

<div class="panel">
  <div class="grp">Mode</div>
  <div class="seg">
    <button id="m4" class="on">grab 4D</button>
    <button id="m3">grab 3D · ambient W</button>
  </div>
  <p class="note" id="modenote">drag turns XW and YW directly, the way hyperspace maps x and y into W.</p>

  <div class="grp">Ambient rates · 4D</div>
  <div id="w-rates"></div>
  <div class="grp">Ambient rates · 3D</div>
  <div id="d-rates"></div>

  <div class="grp">Drawing</div>
  <div id="draw-ctls"></div>
  <label class="ctl" style="grid-template-columns:42px 1fr; align-items:start"><span>noise</span>
    <div class="seg" style="font-size:9.5px; flex-wrap:wrap">
      <button data-o="gothic" class="on">gothic</button><button data-o="streak">streak</button
      ><button data-o="clump">clump</button><button data-o="even">even</button
      ><button data-o="centre">centre</button>
    </div>
  </label>
  <p class="note" id="texnote"></p>

  <div class="grp">Style</div>
  <div id="style-ctls"></div>

  <div class="btns">
    <button id="pause">pause</button>
    <button id="ghost">ghost</button>
    <button id="reset">reset</button>
  </div>
</div>

<script type="module">
import { QArtSolver, rasterise, maxSpan } from './solver.js';
import { drawStyled, DOT_TYPES, EYE_TYPES } from './render.js';

async function loadSolver(name) {
  const [mr, br] = await Promise.all([fetch(name + '.json'), fetch(name + '.bin')]);
  if (!mr.ok || !br.ok) throw new Error('missing ' + name);
  return new QArtSolver(await mr.json(), await br.arrayBuffer());
}
const BLOB = { even:'solver', centre:'solver-centre', clump:'solver-clump',
               streak:'solver-streak', gothic:'solver-gothic' };
const SOLVERS = { gothic: await loadSolver(BLOB.gothic) };
let S = SOLVERS.gothic;
const meta = S.meta;
const n = S.n, quiet = meta.quiet, side = n + 2 * quiet;

const c = document.getElementById('c'), ctx = c.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = tmp.height = n;
const tctx = tmp.getContext('2d', { willReadFrequently:true });

// Six planes, named as hyperspace names them.  W rotations are applied first so
// the shape folds in its own space, then the 3D turn orients that for viewing --
// which is what makes a grab feel like turning the whole folding object.
const PLANES = [
  ['XW', [0,3]], ['YW', [1,3]], ['ZW', [2,3]],
  ['XY', [0,1]], ['XZ', [0,2]], ['YZ', [1,2]],
];
const ang  = Object.fromEntries(PLANES.map(([k]) => [k, 0]));
const rate = Object.fromEntries(PLANES.map(([k]) => [k, 0]));
rate.XW = 0.35;                       // the classic fold, on by default

const opt = { stroke: 3, wDist: 7.0, zDist: 3.0, margin: -0.04 };
const sty = { dotType:'square', eyeFrame:'square', eyeCore:'square', styleEyes:true,
              fg:'#000000', fg2:'#ff2b2b', bg:'#ffffff', gradient:false, px:10 };
// Update rate is deliberately separate from the angles: the shape keeps turning
// at the same speed, we just re-solve less often.  At low rates each redraw is a
// visibly different code, which is the stepped look rather than a churn.
const RATES = [1, 2, 3, 4, 6, 8, 12, 15, 20, 24, 30, 60, 0];   // 0 == uncapped
let rateIdx = RATES.indexOf(12);
let mode = '4d', paused = false, ghost = false, dirty = true, pending = true;
let vx = 0, vy = 0, down = false, px = 0, py = 0;
const SENS = 0.006, FRICTION = 0.90;

// ---- controls ----
function slider(host, key, label, min, max, step, get, set, fmt) {
  const l = document.createElement('label'); l.className = 'ctl';
  l.innerHTML = `<span>${label}</span>`;
  const i = document.createElement('input');
  Object.assign(i, { type:'range', min, max, step, value: get() });
  const v = document.createElement('span'); v.textContent = fmt(get());
  i.oninput = () => { set(+i.value); v.textContent = fmt(+i.value); dirty = true; };
  l.append(i, v); host.append(l);
  return () => { i.value = get(); v.textContent = fmt(get()); };
}
function picker(host, label, values, get, set) {
  const l = document.createElement('label'); l.className = 'ctl';
  l.style.gridTemplateColumns = '42px 1fr';
  l.innerHTML = `<span>${label}</span>`;
  const sel = document.createElement('select');
  sel.style.cssText = 'background:#17171b;border:1px solid var(--line);color:#fff;' +
                      'font:inherit;font-size:10.5px;border-radius:5px;padding:5px 6px;';
  for (const v of values) { const o = document.createElement('option'); o.value = o.textContent = v; sel.append(o); }
  sel.value = get();
  sel.onchange = () => { set(sel.value); dirty = true; };
  l.append(sel); host.append(l);
}
function swatch(host, label, get, set) {
  const l = document.createElement('label'); l.className = 'ctl';
  l.style.gridTemplateColumns = '42px 1fr';
  l.innerHTML = `<span>${label}</span>`;
  const i = document.createElement('input');
  i.type = 'color'; i.value = get();
  i.style.cssText = 'height:24px;border:1px solid var(--line);border-radius:5px;' +
                    'background:#17171b;padding:2px;cursor:pointer;';
  i.oninput = () => { set(i.value); dirty = true; };
  l.append(i); host.append(l);
}
function toggle(host, label, get, set) {
  const l = document.createElement('label'); l.className = 'ctl';
  l.style.gridTemplateColumns = '42px 1fr';
  l.innerHTML = `<span>${label}</span>`;
  const b = document.createElement('button');
  b.style.cssText = 'background:transparent;border:1px solid var(--line);color:var(--dim);' +
                    'font:inherit;font-size:10.5px;border-radius:5px;padding:5px;cursor:pointer;';
  const up = () => { b.textContent = get() ? 'on' : 'off';
                     b.style.color = get() ? 'var(--red)' : 'var(--dim)'; };
  b.onclick = () => { set(!get()); up(); dirty = true; };
  up(); l.append(b); host.append(l);
}
const syncs = [];
for (const [k] of PLANES.slice(0, 3))
  syncs.push(slider(document.getElementById('w-rates'), k, k, -1.5, 1.5, 0.01,
    () => rate[k], v => rate[k] = v, v => (+v).toFixed(2)));
for (const [k] of PLANES.slice(3))
  syncs.push(slider(document.getElementById('d-rates'), k, k, -1.5, 1.5, 0.01,
    () => rate[k], v => rate[k] = v, v => (+v).toFixed(2)));
const dc = document.getElementById('draw-ctls');
syncs.push(slider(dc, 'stroke', 'edge', 1, 6, 1, () => opt.stroke, v => opt.stroke = v, v => v + ' mod'));
syncs.push(slider(dc, 'w', 'w-dist', 2, 14, 0.1, () => opt.wDist, v => opt.wDist = v, v => (+v).toFixed(1)));
syncs.push(slider(dc, 'z', 'z-dist', 2, 14, 0.1, () => opt.zDist, v => opt.zDist = v, v => (+v).toFixed(1)));
syncs.push(slider(dc, 'm', 'margin', -.10, .3, .01, () => opt.margin, v => opt.margin = v, v => (+v).toFixed(2)));
syncs.push(slider(dc, 'rate', 'update', 0, RATES.length - 1, 1,
  () => rateIdx, v => { rateIdx = v; schedule(); },
  v => RATES[v] ? RATES[v] + ' /s' : 'every frame'));

const sc = document.getElementById('style-ctls');
picker(sc, 'dots',  DOT_TYPES, () => sty.dotType,   v => sty.dotType = v);
picker(sc, 'eye',   EYE_TYPES, () => sty.eyeFrame,  v => sty.eyeFrame = v);
picker(sc, 'core',  EYE_TYPES, () => sty.eyeCore,   v => sty.eyeCore = v);
swatch(sc, 'ink',   () => sty.fg,  v => sty.fg = v);
swatch(sc, 'ink 2', () => sty.fg2, v => sty.fg2 = v);
swatch(sc, 'paper', () => sty.bg,  v => sty.bg = v);
toggle(sc, 'grad',  () => sty.gradient, v => sty.gradient = v);
syncs.push(slider(sc, 'px', 'detail', 4, 16, 1, () => sty.px, v => sty.px = v, v => v + ' px'));

const NOTE = {
  '4d': 'drag turns XW and YW directly, the way hyperspace maps x and y into W.',
  '3d': 'drag turns the shape as a rigid 3D body (x → XZ, y → YZ) while the W planes keep folding it — the inverse of hyperspace’s 3D toggle, which holds W instead.',
};
function setMode(m) {
  mode = m;
  document.getElementById('m4').classList.toggle('on', m === '4d');
  document.getElementById('m3').classList.toggle('on', m === '3d');
  document.getElementById('modenote').textContent = NOTE[m];
  if (m === '3d' && !rate.XW && !rate.YW && !rate.ZW) rate.XW = 0.35;
  syncs.forEach(f => f()); dirty = true;
}
const TEXNOTE = {
  gothic: 'low-frequency noise, stretched vertically \u2014 heavy strokes with blob and line artefacts. Closest to the stills.',
  streak: 'strongly vertical noise cells: the leftovers arrive as streaks down the grid.',
  clump:  'isotropic blobs, a touch calmer than gothic.',
  even:   'a low-discrepancy sequence: the leftovers scatter one module at a time, which reads as sparkle.',
  centre: 'every degree of freedom spent on the middle; all the noise piles into a ring at the rim.',
};
async function setTexture(key) {
  if (!SOLVERS[key]) {
    try {
      SOLVERS[key] = await loadSolver(BLOB[key]);
    } catch (e) {
      document.getElementById('texnote').innerHTML =
        `<span style="color:var(--red)">${key} is not built.</span> ` +
        `Run <code>uv run --with pyqart --with pillow gen/export_js.py ` +
        `--url &lt;your-url&gt; --order ${key} --out ${BLOB[key]}</code>`;
      return;
    }
  }
  S = SOLVERS[key];
  for (const b of document.querySelectorAll('[data-o]'))
    b.classList.toggle('on', b.dataset.o === key);
  document.getElementById('texnote').textContent = TEXNOTE[key];
  dirty = true;
}
for (const b of document.querySelectorAll('[data-o]'))
  b.onclick = () => setTexture(b.dataset.o);
document.getElementById('m4').onclick = () => setMode('4d');
document.getElementById('m3').onclick = () => setMode('3d');
document.getElementById('pause').onclick = e => {
  paused = !paused; e.target.textContent = paused ? 'play' : 'pause'; dirty = true; };
document.getElementById('ghost').onclick = () => { ghost = !ghost; dirty = true; };
document.getElementById('reset').onclick = () => {
  for (const [k] of PLANES) ang[k] = 0; vx = vy = 0; dirty = true; };

// ---- drag ----
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => {
  down = true; px = e.clientX; py = e.clientY; vx = vy = 0;
  stage.classList.add('grabbing'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = (e.clientX - px) * SENS, dy = (e.clientY - py) * SENS;
  px = e.clientX; py = e.clientY; vx = dx; vy = dy;
  applyDrag(dx, dy); pending = true;
});
for (const ev of ['pointerup','pointercancel'])
  stage.addEventListener(ev, () => { down = false; stage.classList.remove('grabbing'); });
function applyDrag(dx, dy) {
  if (mode === '4d') { ang.XW += dx; ang.YW += dy; }
  else               { ang.XZ += dx; ang.YZ += dy; }   // trackball: about Y, about X
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'g') { ghost = !ghost; dirty = true; }
  if (k === 'r') document.getElementById('reset').click();
  if (k === ' ') { e.preventDefault(); document.getElementById('pause').click(); }
});

// ---- loop ----
const angEl = document.getElementById('angles');
const deg = r => (((r * 180 / Math.PI) % 360) + 360) % 360;
let last = performance.now();

function paint(mods, want) {
  drawStyled(ctx, mods, n, quiet, sty);
  if (ghost) {                        // the source drawing, under the modules
    const px = sty.px;
    ctx.globalCompositeOperation = 'destination-over';
    ctx.fillStyle = 'rgba(255,120,120,.40)';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (want[y*n+x]) ctx.fillRect((x+quiet)*px, (y+quiet)*px, px, px);
    ctx.globalCompositeOperation = 'source-over';
  }
  let hit = 0, tot = 0;
  for (let i = 0; i < n*n; i++) if (want[i]) { tot++; if (mods[i]) hit++; }
  return tot ? hit / tot : 1;
}

let drawnAt = [];
let timer = null, lastStep = 0;

// A capped rate is driven by a timer, not requestAnimationFrame: rAF is paced by
// the compositor (and throttled hard in a background or embedded view), so it
// cannot deliver "4 updates a second" on purpose.  Only "every frame" uses rAF.
function schedule() {
  clearTimeout(timer);
  const hz = RATES[rateIdx];
  if (!hz) { requestAnimationFrame(step); return; }
  // wait until the next deadline rather than a flat interval, so the time spent
  // solving and drawing does not get added on top of the requested period
  const now = performance.now();
  timer = setTimeout(() => step(performance.now()),
                     Math.max(0, lastStep + 1000 / hz - now));
}

function step(t) {
  // the angles advance by real elapsed time, so the turn speed is the same
  // whatever the update rate -- a lower rate samples that motion, it does not
  // slow it down
  const dt = Math.min((t - last) / 1000, 0.25); last = t; lastStep = t;
  if (!paused) {
    for (const [k] of PLANES) if (rate[k]) { ang[k] += rate[k] * dt; pending = true; }
  }
  if (!down && (Math.abs(vx) > 1e-5 || Math.abs(vy) > 1e-5)) {
    applyDrag(vx, vy); vx *= FRICTION; vy *= FRICTION; pending = true;
  }
  if (pending || dirty) {
    drawnAt.push(t);
    while (drawnAt.length && t - drawnAt[0] > 1000) drawnAt.shift();
    const t0 = performance.now();
    const list = PLANES.map(([k, p]) => [p, ang[k]]);
    const want = rasterise(tctx, n, list, opt.stroke, opt.margin,
                           { wDist: opt.wDist, zDist: opt.zDist,
                             span: maxSpan(opt.wDist, opt.zDist) });
    const mods = S.solve(want);
    const ms = performance.now() - t0;
    const frac = paint(mods, want);
    document.getElementById('ms').textContent = ms.toFixed(2) + ' ms';
    document.getElementById('hit').textContent = (frac * 100).toFixed(0) + '%';
    document.getElementById('hz').textContent = drawnAt.length + ' /s';
    angEl.innerHTML = PLANES.map(([k]) =>
      `<span>${k} <b>${deg(ang[k]).toFixed(0)}\u00B0</b></span>`).join('');
    dirty = false; pending = false;
  }
  schedule();
}

window.__probe = (set, o = {}) => {
  const a = { ...ang, ...set }, p = { ...opt, ...o };
  const want = rasterise(tctx, n, PLANES.map(([k, pl]) => [pl, a[k]]), p.stroke,
                         p.margin, { wDist: p.wDist, zDist: p.zDist,
                                     span: maxSpan(p.wDist, p.zDist) });
  const mods = Array.from(S.solve(want));
  dirty = true;                       // repaint the real state on the next frame
  return { n, mods };
};
window.__png = () => c.toDataURL('image/png');
setMode('4d');
setTexture('gothic');
schedule();
</script>
