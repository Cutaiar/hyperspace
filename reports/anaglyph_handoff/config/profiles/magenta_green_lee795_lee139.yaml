# CANDIDATE custom magenta/green gel pair: LEE 139 Primary Green (LEFT) + LEE 795 Magical Magenta (RIGHT).
# Eye assignment follows Dubois GM 2010 (left = green, right = magenta) and the
# TrioScopics / Berezin convention (magenta on the right eye).
#
# !!! PLACEHOLDER !!!  The matrices below are Dubois's green-magenta 2010 preset,
# "optimized for LCD display and TrioScopics3D glasses". They are a STARTING POINT
# ONLY and are NOT calibrated for LEE 795 / LEE 139 or for any projector.
# Fallback if the preset looks wrong: channel mask
#   M_left  = [[0,0,0],[0,1,0],[0,0,0]]   (G from left)
#   M_right = [[1,0,0],[0,0,0],[0,0,1]]   (R, B from right)
kind: anaglyph_profile
schema_version: "1.0.0"
name: magenta_green_lee795_lee139
version: "0.1.0"
description: >
  Candidate DIY magenta/green pair for test 2. Published LEE spectra (plot C2):
  139 passes about 23.6 % mean in 530-560 nm with blue/red at or near the 0.01 floor;
  795 passes about 47.5 % (445-465) and 62.4 % (610-640) with about 0.49 % in 530-560.
  Matrices = Dubois GM 2010 preset, PLACEHOLDER, not calibrated for these gels.
