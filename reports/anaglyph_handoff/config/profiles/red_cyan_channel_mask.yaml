# Red/cyan, pure channel mask (Wimmer "Color" anaglyph; Blender's anaglyph encoding).
# FIRST preset to bring up (test step 1). Overall status PLACEHOLDER: nothing here is
# calibrated for the Hyperspace projector. Unknown numbers are null, never guessed.
# Schema: ../anaglyph_profile.schema.json
kind: anaglyph_profile
schema_version: "1.0.0"
name: red_cyan_channel_mask
version: "0.1.0"
description: >
  Pure channel mask in linear light: output R = left R, output G = right G,
  output B = right B. Exact only when each filter passes exactly its assigned
  projector primaries; a matrix pays off once filters and primaries do not align
  (rendering_algorithms.md Q5).
status: placeholder
color_pair: red_cyan

