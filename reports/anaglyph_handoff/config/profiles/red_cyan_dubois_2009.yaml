# Red/cyan, Dubois least-squares matrices, revised March 2009 version.
# Matrix numbers copied EXACTLY from rendering_algorithms.md Q3, which transcribes
# Dubois, "Conversion of a Stereo Pair to Anaglyph with the Least-Squares Projection
# Method" (March 2009), labelled "for red/cyan glasses and CRT/plasma display".
# Dubois procedure: sRGB EOTF -> matrices -> clip EACH term to [0,1] -> add -> sRGB OETF.
# NOT fitted to the Hyperspace projector or to the gels below: overall status PLACEHOLDER.
kind: anaglyph_profile
schema_version: "1.0.0"
name: red_cyan_dubois_2009
version: "0.1.0"
description: >
  Second red/cyan preset (after the channel mask). Published Dubois 2009 matrices
  applied in linear light. Use for comparison only until matrices are recomputed
  from measured projector SPDs and filter transmissions (compute_dubois_matrix.py).
status: placeholder
color_pair: red_cyan

provenance:
  source_type: published_preset
  created_by: anaglyph_handoff (generated from research notes, 2026-10-17)
  created_date: "2026-10-17"
  citations:
    - title: "Dubois, Conversion of a Stereo Pair to Anaglyph with the Least-Squares Projection Method, March 2009"
      url: https://www.site.uottawa.ca/~edubois/anaglyph/LeastSquaresHowToPhotoshop.pdf
      notes_file: "research_notes/Custom anaglyph 3D projection plan/rendering_algorithms.md"
      note: "Q3 'Revised red-cyan'; input assumed sRGB; each term clipped before adding."
    - title: "Dubois anaglyph page"
      url: https://www.site.uottawa.ca/~edubois/anaglyph/
  notes: "The 'classic' red-cyan matrix shipped by ffmpeg arcd / three.js (0.456, 0.500, 0.176, ...) is a DIFFERENT, older set and is not used here."

