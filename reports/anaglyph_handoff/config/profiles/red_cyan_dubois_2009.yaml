matrices:
  # Exact values from rendering_algorithms.md Q3 (Dubois 2009). Do not round or edit.
  M_left:
    - [0.437, 0.449, 0.164]
    - [-0.062, -0.062, -0.024]
    - [-0.048, -0.050, -0.017]
  M_right:
    - [-0.011, -0.032, -0.007]
    - [0.377, 0.761, 0.009]
    - [-0.026, -0.093, 1.234]
  layout: row_major_output_rows
  input_color_space: "sRGB (Dubois 2009: input 'assumed to be sRGB')"
  output_color_space: "sRGB as assumed by Dubois; projector primaries NOT accounted for (PLACEHOLDER)"
  math_domain: linear
  decode_transfer: srgb_eotf
  encode_transfer: srgb_oetf
  clip_mode: clip_each_term_then_sum
  status: placeholder
  source:
    title: "Dubois 2009 revised red-cyan, 'for red/cyan glasses and CRT/plasma display'"
    url: https://www.site.uottawa.ca/~edubois/anaglyph/LeastSquaresHowToPhotoshop.pdf
    notes_file: "research_notes/Custom anaglyph 3D projection plan/rendering_algorithms.md"
  row_sum_check: [1.000, 0.999, 1.000]
  notes: "status placeholder because the matrices were designed for CRT/plasma primaries and generic red/cyan glasses, not this projector or LEE 106/172. Row sums match the notes' check (Q3 Inferences)."

