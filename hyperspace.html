<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyperspace — 4D polytope viewer</title>
<style>
  :root{
    --red:#ff2b2b;
    --line:rgba(255,255,255,.14);
    --dim:rgba(255,255,255,.42);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:var(--mono);
    color:#fff;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:0}
  canvas.dragging{cursor:grabbing}

  /* ---------- readout ---------- */
  #readout{
    position:fixed;top:0;left:0;padding:22px 26px;
    pointer-events:none;user-select:none;
    transition:opacity .3s;
  }
  #cells{
    font-size:clamp(52px,11vw,104px);
    line-height:.84;font-weight:500;letter-spacing:-.05em;
  }
  #cells sub{
    font-size:11px;letter-spacing:.22em;vertical-align:baseline;
    color:var(--dim);margin-left:10px;text-transform:uppercase;
  }
  #name{margin-top:14px;font-size:15px;letter-spacing:.02em}
  #alias{color:var(--red);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:5px;min-height:13px}
  #schlafli{color:var(--dim);font-size:12px;margin-top:9px;letter-spacing:.06em}
  #counts{color:var(--dim);font-size:10.5px;letter-spacing:.13em;margin-top:3px;text-transform:uppercase}

  /* ---------- console ---------- */
  #console{
    position:fixed;left:0;bottom:0;width:min(340px,100vw);
    border-top:1px solid var(--line);border-right:1px solid var(--line);
    background:rgba(0,0,0,.55);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    display:flex;flex-direction:column;z-index:10;
    max-height:72vh;          /* fallback */
    max-height:72dvh;         /* dvh tracks the visible viewport on iOS */
  }
  #handle{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    padding:16px 26px;background:transparent;border:0;cursor:pointer;min-height:52px;
    font-family:inherit;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);
  }
  #handle:hover{color:#fff}
  #handle:focus-visible{outline:1px solid var(--red);outline-offset:-3px}
  #chev{
    display:inline-block;transition:transform .3s cubic-bezier(.4,0,.2,1);
    color:var(--red);font-size:11px;letter-spacing:0;
  }
  #console.collapsed #chev{transform:rotate(180deg)}
  #body{
    padding:4px 26px 22px;
    flex:1 1 auto;min-height:0;
    overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;
    transition:opacity .22s,padding .34s;
  }
  #body::-webkit-scrollbar{width:3px}
  #body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28)}
  #body::-webkit-scrollbar-track{background:transparent}
  #console.collapsed #body{flex:0 0 0;height:0;opacity:0;padding-top:0;padding-bottom:0;overflow:hidden}

  .row{margin-bottom:15px}
  .row:last-child{margin-bottom:0}
  label.cap{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    margin-bottom:4px;
  }
  label.cap b{color:#fff;font-weight:500;letter-spacing:.08em}

  /* sliders: tall invisible hit area, hairline track */
  /* pan-y: a vertical gesture belongs to #body's scroll, not to the fader */
  .slider{
    position:relative;height:30px;display:flex;align-items:center;
    touch-action:pan-y;cursor:pointer;
    -webkit-user-select:none;user-select:none;
  }
  /* the range input is keyboard/focus only — all pointer work happens on .slider */
  .slider input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:30px;background:transparent;margin:0;
    touch-action:pan-y;cursor:pointer;pointer-events:none;
  }
  .slider input[type=range]::-webkit-slider-runnable-track{height:30px;background:transparent}
  .slider input[type=range]::-moz-range-track{height:30px;background:transparent}
  .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border:0}
  .slider input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
  .slider input[type=range]:focus-visible{outline:1px solid var(--red);outline-offset:-2px}
  .track{position:absolute;left:0;right:0;top:14.5px;height:1px;background:rgba(255,255,255,.26);pointer-events:none}
  .fill{position:absolute;left:0;top:14.5px;height:1px;background:rgba(255,255,255,.55);pointer-events:none}
  .knob{
    position:absolute;top:8px;width:3px;height:15px;background:var(--red);
    transform:translateX(-1.5px);pointer-events:none;
  }
  .ticks{display:flex;justify-content:space-between;margin-top:1px;font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.1em}

  .planes{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .planes button{
    font-family:inherit;font-size:10px;letter-spacing:.06em;
    padding:11px 0;background:transparent;color:rgba(255,255,255,.4);
    border:1px solid var(--line);border-radius:0;cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
  }
  .planes button[aria-pressed=true]{color:#fff;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.07)}
  .planes button:focus-visible{outline:1px solid var(--red);outline-offset:2px}

  .toggles{display:flex;gap:8px}
  .toggles button{
    flex:1;font-family:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:12px 0;background:transparent;color:rgba(255,255,255,.4);
    border:1px solid var(--line);border-radius:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:color .15s,border-color .15s;
  }
  .toggles button .dot{width:6px;height:6px;background:rgba(255,255,255,.22);border-radius:50%;transition:background .15s,box-shadow .15s}
  .toggles button[aria-pressed=true]{color:#fff;border-color:rgba(255,255,255,.45)}
  .toggles button[aria-pressed=true] .dot{background:var(--red);box-shadow:0 0 7px var(--red)}
  .toggles button:focus-visible{outline:1px solid var(--red);outline-offset:2px}
  .fbtn{
    flex:1;position:relative;overflow:hidden;
    font-family:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:12px 0;color:rgba(255,255,255,.4);border:1px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .fbtn .dot{width:6px;height:6px;background:rgba(255,255,255,.22);border-radius:50%}
  .fbtn[aria-pressed=true]{color:#fff;border-color:rgba(255,255,255,.45)}
  .fbtn[aria-pressed=true] .dot{background:var(--red);box-shadow:0 0 7px var(--red)}
  .fbtn input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}

  /* transport — only live in file mode, dimmed but never removed so
     nothing under it shifts when a track loads */
  .transport{display:flex;gap:8px;margin-top:8px}
  .transport button{
    flex:1;font-family:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:11px 0;background:transparent;color:rgba(255,255,255,.72);
    border:1px solid var(--line);border-radius:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:color .15s,border-color .15s;
  }
  .transport button:hover:not(:disabled){color:#fff;border-color:rgba(255,255,255,.45)}
  .transport button:focus-visible{outline:1px solid var(--red);outline-offset:2px}
  .transport button:disabled{color:rgba(255,255,255,.17);border-color:rgba(255,255,255,.06);cursor:default}
  .transport .g{color:var(--red);font-size:9px;letter-spacing:0}
  .transport button:disabled .g{color:rgba(255,255,255,.17)}
  #trTime{
    flex:0 0 auto;display:flex;align-items:center;padding:0 11px;
    border:1px solid var(--line);font-size:9.5px;letter-spacing:.12em;
    color:rgba(255,255,255,.55);white-space:nowrap;
  }
  #trTime.off{color:rgba(255,255,255,.17);border-color:rgba(255,255,255,.06)}

  /* ---------- audio section ---------- */
  .rule{border-top:1px solid var(--line);margin:18px 0 14px}
  .meters{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
  .meter{display:flex;flex-direction:column;align-items:center;gap:4px}
  .meter .bar{position:relative;width:100%;height:56px;border:1px solid var(--line);display:flex;gap:1px;overflow:hidden}
  .meter .col{position:relative;flex:1}
  .meter .lvl{position:absolute;left:0;right:0;bottom:0;height:0%;background:rgba(255,255,255,.9)}
  .meter .hit{position:absolute;left:0;right:0;bottom:0;height:0%;background:var(--red)}
  /* everything above the nominal line is headroom. The zone is tinted so an
     idle meter still shows how much room it has left, and the part of a bar
     that pushes into it turns red whichever column it is in. */
  .meter .zone{position:absolute;left:0;right:0;top:0;background:rgba(255,43,43,.07);pointer-events:none}
  .meter .nom{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.32);pointer-events:none;z-index:3}
  .meter .ovr{position:absolute;left:0;right:0;height:0%;background:var(--red);box-shadow:0 0 5px rgba(255,43,43,.7);z-index:2}
  .legend{display:flex;gap:12px;margin-top:8px;font-size:8.5px;letter-spacing:.13em;color:rgba(255,255,255,.38);text-transform:uppercase}
  .legend i{display:inline-block;width:7px;height:7px;margin-right:5px;vertical-align:-1px;font-style:normal}
  .legend .a{background:rgba(255,255,255,.9)}
  .legend .b{background:var(--red)}
  .legend .c{background:rgba(255,43,43,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.32)}
  .shapers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}
  .shapers select{
    width:100%;font-family:inherit;font-size:8.5px;letter-spacing:.04em;text-align:center;
    padding:6px 1px;background:#000;color:#fff;border:1px solid var(--line);border-radius:0;
    -webkit-appearance:none;appearance:none;cursor:pointer;
  }
  .shapers select:focus-visible{outline:1px solid var(--red);outline-offset:1px}
  .shapers select option{background:#000;font-size:11px}
  .meter{cursor:pointer}
  .meter.sel .bar{border-color:var(--red)}
  .meter .col.over::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--red);box-shadow:0 0 6px var(--red)}
  .meter.sel .tag{color:#fff}
  /* Hint readout — an LCD window in the same bezel, sitting directly ABOVE the
     console and out of every flow, so its height can change freely without
     moving a single control. Never interactive: pointer-events stay off.
     The fill is fully opaque: this strip overlaps the readout block and the
     animating canvas, and at 9px a translucent backdrop made it unreadable.
     No backdrop-filter — pointless behind an opaque fill, and it would cost
     a blur every frame over a canvas that never stops moving. */
  #hint{
    position:absolute;left:0;right:0;bottom:100%;z-index:2;
    padding:11px 26px 12px;
    border-top:1px solid var(--line);border-right:1px solid var(--line);
    background:#050505;
    font-size:9px;line-height:1.6;letter-spacing:.06em;color:rgba(255,255,255,.62);
    pointer-events:none;user-select:none;
    opacity:0;transform:translateY(5px);
    transition:opacity .18s ease,transform .18s ease;
  }
  #hint.on{opacity:1;transform:none}
  #hint b{color:var(--red);font-weight:500;letter-spacing:.14em;text-transform:uppercase}
  #strip{border:1px solid var(--line);padding:12px 13px 13px;margin-top:10px}
  #stripHead{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);
    margin-bottom:11px;
  }
  #stripHead em{font-style:normal;color:rgba(255,255,255,.4);letter-spacing:.1em}
  .krow{margin-bottom:7px}
  .krow:last-child{margin-bottom:0}
  .krow label.cap{margin-bottom:1px;font-size:9px;letter-spacing:.16em}
  .krow .slider{height:24px}
  .krow .track,.krow .fill{top:11.5px}
  .krow .knob{top:5px;height:14px}
  #sceneWrap select{
    width:100%;font-family:inherit;font-size:10px;letter-spacing:.1em;
    padding:9px 8px;background:#000;color:#fff;border:1px solid var(--line);border-radius:0;
    -webkit-appearance:none;appearance:none;cursor:pointer;
  }
  #sceneWrap select option{font-size:12px}
  .meter .tag{font-size:8px;letter-spacing:.08em;color:rgba(255,255,255,.45)}
  .meter .pl{font-size:8px;letter-spacing:.08em;color:var(--red)}
  #audioMsg{font-size:9.5px;line-height:1.6;letter-spacing:.05em;color:var(--dim);margin-top:10px;min-height:12px}
  #audioMsg.err{color:var(--red)}
  #audioRow.idle .meters{opacity:.32}

  #keys{
    position:fixed;right:20px;bottom:16px;font-size:9.5px;letter-spacing:.14em;
    color:rgba(255,255,255,.26);text-transform:uppercase;text-align:right;line-height:1.9;
    pointer-events:none;user-select:none;
  }
  #keys kbd{font:inherit;color:rgba(255,255,255,.5)}

  @media (max-width:640px){
    #readout{padding:16px 18px}
    #console{width:100%;border-right:0}
    #handle{padding:14px 18px}
    #body{padding:4px 18px 20px}
    #hint{padding:10px 18px 11px;border-right:0}
    #keys{display:none}
    #cells{font-size:clamp(44px,15vw,72px)}
  }
  @media (prefers-reduced-motion:reduce){
    #body,#chev,#hint{transition:none}
    #hint{transform:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="readout">
  <div id="cells">8<sub>cells</sub></div>
  <div id="name">Tesseract</div>
  <div id="alias">hypercube</div>
  <div id="schlafli">{4,3,3}</div>
  <div id="counts">16 vertices · 32 edges</div>
</div>

<div id="console">
  <div id="hint" aria-hidden="true"></div>
  <button id="handle" aria-expanded="true" aria-controls="body">
    <span>Controls</span><span id="chev">▼</span>
  </button>

  <div id="body">
    <div class="row idle" id="audioRow">
      <label class="cap" for="drive">Audio drive <b id="driveVal">1.00</b></label>
      <div class="slider" data-for="drive">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
        <input id="drive" type="range" min="0" max="300" step="5" value="100">
      </div>
      <label class="cap" for="dyn">Dynamics <b id="dynVal">1.00</b></label>
      <div class="slider" data-for="dyn">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
        <input id="dyn" type="range" min="0" max="150" step="5" value="100">
      </div>
      <div class="row" id="sceneWrap" style="margin-bottom:14px">
        <label class="cap" for="scene">Scene</label>
        <select id="scene"></select>
      </div>
      <div class="meters" id="meters"></div>
      <div class="shapers" id="shapers"></div>
      <div class="legend"><span><i class="a"></i>input</span><span><i class="b"></i>fader out</span><span><i class="c"></i>headroom</span></div>
      <div id="strip">
        <div id="stripHead"><span id="stripName">SUB</span><em id="stripPlane">ZW plane</em></div>
        <div id="knobs"></div>
      </div>
      <div id="audioMsg">Each band drives one rotation plane. Silence in a band stops that plane.</div>
      <div class="toggles" style="margin-top:10px">
        <button id="tMic" aria-pressed="false"><span class="dot"></span>Listen to mic</button>
        <label class="fbtn" id="tFile" aria-pressed="false"><span class="dot"></span>Load a track<input id="fileIn" type="file" accept="audio/*"></label>
      </div>
      <div class="transport">
        <button id="trPlay" disabled><span class="g">&#9654;</span>Play</button>
        <button id="trRestart" disabled><span class="g">&#8635;</span>Restart</button>
        <div id="trTime" class="off">0:00 / 0:00</div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="row">
      <label class="cap" for="shape">Shape <b id="shapePos">4 / 18</b></label>
      <div class="slider" data-for="shape">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
        <input id="shape" type="range" min="0" max="17" step="1" value="3">
      </div>
      <div class="ticks"><span>5 cells</span><span>600 cells</span></div>
    </div>

    <div class="row">
      <label class="cap" for="bright">Brightness <b id="brightVal">1.00</b></label>
      <div class="slider" data-for="bright">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
        <input id="bright" type="range" min="15" max="220" step="1" value="100">
      </div>
    </div>

    <div class="row">
      <label class="cap" for="speed">Rotation speed <b id="speedVal">0.30</b></label>
      <div class="slider" data-for="speed">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
        <input id="speed" type="range" min="0" max="150" step="1" value="30">
      </div>
    </div>

    <div class="row">
      <label class="cap" for="depth">4D perspective <b id="depthVal">2.6</b></label>
      <div class="slider" data-for="depth">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
        <input id="depth" type="range" min="115" max="600" step="5" value="260">
      </div>
    </div>

    <div class="row">
      <label class="cap">Rotation planes</label>
      <div class="planes" id="planes">
        <button data-p="0" aria-pressed="false">XY</button>
        <button data-p="1" aria-pressed="false">XZ</button>
        <button data-p="2" aria-pressed="true">YZ</button>
        <button data-p="3" aria-pressed="true">XW</button>
        <button data-p="4" aria-pressed="false">YW</button>
        <button data-p="5" aria-pressed="false">ZW</button>
      </div>
    </div>

    <div class="row">
      <div class="toggles">
        <button id="tPoints" aria-pressed="true"><span class="dot"></span>Points</button>
        <button id="tPlay" aria-pressed="true"><span class="dot"></span>Rotate</button>
      </div>
    </div>

  </div>
</div>

<div id="keys">
  <div><kbd>drag</kbd> turn view</div>
  <div><kbd>← →</kbd> shape &nbsp; <kbd>space</kbd> pause</div>
  <div><kbd>P</kbd> points &nbsp; <kbd>H</kbd> panel &nbsp; <kbd>R</kbd> reset</div>
  <div><kbd>K</kbd> track &nbsp; <kbd>0</kbd> restart</div>
</div>

<script>
"use strict";

/* ============================================================
   4D polytope construction
   ============================================================ */
const PHI = (1 + Math.sqrt(5)) / 2;
const IP1 = 1 / PHI, IP2 = 1 / (PHI * PHI), PH2 = PHI * PHI, R5 = Math.sqrt(5);

const kkey = v => v.map(x => Math.round(x * 1e6) / 1e6 + 0).join(",");

const PERMS = (() => {
  const out = [];
  const walk = (cur, rest) => {
    if (!rest.length) { out.push(cur.slice()); return; }
    for (let i = 0; i < rest.length; i++)
      walk(cur.concat(rest[i]), rest.slice(0, i).concat(rest.slice(i + 1)));
  };
  walk([], [0, 1, 2, 3]);
  return out.map(p => {
    let inv = 0;
    for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) if (p[i] > p[j]) inv++;
    return { p, even: inv % 2 === 0 };
  });
})();

function expand(base, mode, into) {
  const map = into || new Map();
  for (const { p, even } of PERMS) {
    if (mode === "even" && !even) continue;
    const v = [base[p[0]], base[p[1]], base[p[2]], base[p[3]]];
    for (let s = 0; s < 16; s++) {
      const w = [(s & 1) ? -v[0] : v[0], (s & 2) ? -v[1] : v[1], (s & 4) ? -v[2] : v[2], (s & 8) ? -v[3] : v[3]];
      map.set(kkey(w), w);
    }
  }
  return map;
}

const d2 = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) { const t = a[i] - b[i]; s += t * t; } return s; };

function edgesByMinDist(V, tol = 1e-4) {
  let min = Infinity;
  for (let i = 0; i < V.length; i++)
    for (let j = i + 1; j < V.length; j++) { const d = d2(V[i], V[j]); if (d < min) min = d; }
  const lim = min * (1 + tol) + 1e-9, E = [];
  for (let i = 0; i < V.length; i++)
    for (let j = i + 1; j < V.length; j++) if (d2(V[i], V[j]) <= lim) E.push([i, j]);
  return E;
}
const auto = V => ({ V, E: edgesByMinDist(V) });

function cyc3(a, b, c) {
  const map = new Map();
  for (const t of [[a, b, c], [b, c, a], [c, a, b]])
    for (let s = 0; s < 8; s++) {
      const v = [(s & 1) ? -t[0] : t[0], (s & 2) ? -t[1] : t[1], (s & 4) ? -t[2] : t[2]];
      map.set(kkey(v), v);
    }
  return [...map.values()];
}
const icosa3 = () => cyc3(0, 1, PHI);
const dodeca3 = () => {
  const m = new Map();
  for (let s = 0; s < 8; s++) {
    const v = [(s & 1) ? -1 : 1, (s & 2) ? -1 : 1, (s & 4) ? -1 : 1];
    m.set(kkey(v), v);
  }
  for (const v of cyc3(0, IP1, PHI)) m.set(kkey(v), v);
  return [...m.values()];
};

function prism(V3) {
  const E3 = edgesByMinDist(V3);
  let minL = Infinity;
  for (const [a, b] of E3) minL = Math.min(minL, Math.sqrt(d2(V3[a], V3[b])));
  const h = minL / 2, n = V3.length, V = [], E = [];
  for (const v of V3) V.push([v[0], v[1], v[2], h]);
  for (const v of V3) V.push([v[0], v[1], v[2], -h]);
  for (const [a, b] of E3) { E.push([a, b]); E.push([a + n, b + n]); }
  for (let i = 0; i < n; i++) E.push([i, i + n]);
  return { V, E };
}

function duoprism(n, m, equalRadii) {
  const r1 = equalRadii ? 1 : 1 / (2 * Math.sin(Math.PI / n));
  const r2 = equalRadii ? 1 : 1 / (2 * Math.sin(Math.PI / m));
  const V = [], E = [], idx = (i, j) => i * m + j;
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n;
    for (let j = 0; j < m; j++) {
      const b = 2 * Math.PI * j / m;
      V.push([r1 * Math.cos(a), r1 * Math.sin(a), r2 * Math.cos(b), r2 * Math.sin(b)]);
    }
  }
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) {
    E.push([idx(i, j), idx((i + 1) % n, j)]);
    E.push([idx(i, j), idx(i, (j + 1) % m)]);
  }
  return { V, E };
}

const simplex5 = () => [
  [1, 1, 1, -1 / R5], [1, -1, -1, -1 / R5], [-1, 1, -1, -1 / R5],

const cache = new Array(SHAPES.length);
function geom(i) {
  if (cache[i]) return cache[i];
  const g = SHAPES[i].build();
  let max = 0;
  for (const v of g.V) max = Math.max(max, Math.hypot(v[0], v[1], v[2], v[3]));
  const s = 1 / max;
  const V = new Float64Array(g.V.length * 4);
  g.V.forEach((v, k) => { for (let d = 0; d < 4; d++) V[k * 4 + d] = v[d] * s; });
  const E = new Int32Array(g.E.length * 2);
  g.E.forEach((e, k) => { E[k * 2] = e[0]; E[k * 2 + 1] = e[1]; });
  return (cache[i] = { V, E, n: g.V.length, m: g.E.length });
}

/* ------------------------------------------------------------
   Transfer stage — a Fruity Peak Controller between the band
   meter and the fader it drives. The input is the rolling-window
   RMS; the output is an automation signal, and the two need not
   look anything alike. Each entry gets its own scratch state so
   envelopes and LFOs can hold values between frames.

   X now arrives with headroom — it runs 0..HEAD, where 1.0 is
   nominal — so every shaper has to stay sane above 1. Most already
   do, because they are monotone. Three did not: S-curve turns back
   on itself past 1 (x²(3−2x) peaks at x=1 and falls), Gate threw the
   overshoot away by returning a flat 1, and Invert went negative.
   Those three are handled explicitly below; the rest pass headroom
   through on their own.
------------------------------------------------------------ */
const SHAPERS = [
  { tag: "LIN",  name: "Linear — Y = X",              f: (s, x) => x },
  { tag: "SQRT", name: "Sqrt — Y = √X, lifts quiet",  f: (s, x) => Math.sqrt(x) },
  { tag: "SQ",   name: "Squared — Y = X², punchier",  f: (s, x) => x * x },
  { tag: "CUBE", name: "Cubed — Y = X³, peaks only",  f: (s, x) => x * x * x },
  { tag: "CURV", name: "S-curve — soft knee both ends",
    f: (s, x) => (x < 1 ? x * x * (3 - 2 * x) : x) },     // linear past nominal
  { tag: "GATE", name: "Gate — hard on above threshold",
    f: (s, x) => (x > 0.35 ? (x > 1 ? x : 1) : 0) },      // keep the overshoot
  { tag: "INV",  name: "Invert — loud stops, silence spins",
    f: (s, x) => (x < 1 ? 1 - x : 0) },                   // no headroom by nature
  { tag: "HOLD", name: "Peak hold — instant rise, slow fall",
    f: (s, x, dt) => { s.h = Math.max(x, (s.h || 0) - dt / 0.7); return s.h; } },
  { tag: "STAC", name: "Staccato — 4 ms attack, 75 ms decay",

      return s.e > 0.12 ? s.e : 0;

  { tag: "TREM", name: "Tremolo — 6 Hz sine, 70% depth",

  const v = [0, 0, 0, 0];

  for (let i = 0; i < g.n; i++) {
    v[0] = g.V[i * 4]; v[1] = g.V[i * 4 + 1]; v[2] = g.V[i * 4 + 2]; v[3] = g.V[i * 4 + 3];
    for (let p = 0; p < 6; p++) {
      const a = PLANES[p][0], b = PLANES[p][1];
      const va = v[a], vb = v[b];
      v[a] = va * cs[p] - vb * sn[p];
      v[b] = va * sn[p] + vb * cs[p];
    }
    const k = D4 / (D4 - v[3]);
    const x = v[0] * k, y = v[1] * k, z = v[2] * k;
    let x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
    const y1 = y * cp - z1 * sp; z1 = y * sp + z1 * cp;
    const k2 = CAM3 / (CAM3 - z1 * 0.9);
    px[i] = cx + x1 * k2 * scale;
    py[i] = cyy - y1 * k2 * scale;
    pd[i] = v[3];
    if (v[3] < near) near = v[3];
    if (v[3] > far) far = v[3];
  }

  const span = Math.max(far - near, 1e-6);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  if (ord.length !== g.m) { ord = new Array(g.m); for (let e = 0; e < g.m; e++) ord[e] = e; }
  for (let e = 0; e < g.m; e++) edepth[e] = (pd[g.E[e * 2]] + pd[g.E[e * 2 + 1]]) * 0.5;
  ord.sort((a, b) => edepth[a] - edepth[b]);

  // density compensation: dense hulls would otherwise clip to solid white
  const dens = clamp(340 / Math.max(g.m, 1), 0.42, 1);
  const B = S.bright * dens;
  const heavy = g.m > 500;

  ctx.lineCap = "round";
  for (let q = 0; q < g.m; q++) {
    const e = ord[q], i = g.E[e * 2], j = g.E[e * 2 + 1];
    const t = (edepth[e] - near) / span;
    const a = clamp((0.10 + 0.90 * t * t) * B, 0.015, 1);
    ctx.strokeStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
    ctx.lineWidth = (heavy ? 0.35 + 0.85 * t : 0.5 + 1.5 * t) * clamp(0.75 + 0.35 * S.bright, 0.6, 1.35);
    ctx.beginPath();
    ctx.moveTo(px[i], py[i]);
    ctx.lineTo(px[j], py[j]);
    ctx.stroke();
  }

  if (S.points) {
    const PB = S.bright * clamp(dens * 1.5, 0.55, 1);
    for (let i = 0; i < g.n; i++) {
      const t = (pd[i] - near) / span;
      const r = (heavy ? 1.0 : 1.7) + 2.3 * t * t;
      ctx.fillStyle = "rgba(255,43,43," + clamp((0.32 + 0.68 * t) * PB, 0.05, 1).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(px[i], py[i], r, 0, 6.2832);
      ctx.fill();
    }
  }
}

/* ---- per-frame audio analysis ---- */
function audioStep(dt) {
  const A = AUDIO;
  A.an.getFloatFrequencyData(A.freq);

  const DYN = A.dyn;
  const kPk = 1 - Math.exp(-dt / PK_TAU), kVal = 1 - Math.exp(-dt / VAL_TAU);
  const kSlow = 1 - Math.exp(-dt / SLOW_T);
  const fpkDec = Math.exp(-dt / 2.5);

  // Warm-up. Every tracker here is adaptive, so on the first frames after a
  // source is attached they hold their seeds rather than the track's actual
  // statistics — and an expander running against a stale mean throws the
  // whole set of bars at the ceiling for the first few seconds. Snap the
  // window to the signal on the opening frames, then run the mean fast for
  // about a second before settling into MEAN_TAU.
  A.warm++;
  const seeding = A.warm <= 3;
  const kAvg = 1 - Math.exp(-dt / (A.warm < 60 ? 0.25 : MEAN_TAU));

  for (let i = 0; i < 6; i++) {
    const P = PARAMS[i];

    // band RMS from the power spectrum, into u where 1.0 is nominal
    let pw = 0, n = 0;
    for (let k = A.binLo[i]; k <= A.binHi[i]; k++) {
      const m = Math.pow(10, A.freq[k] / 20);
      pw += m * m; n++;
    }
    const rms = Math.sqrt(pw / Math.max(n, 1));
    const db = 20 * Math.log10(rms + 1e-9);
    const u = clamp((db - U_LO) / U_SPAN, 0, 2.5);

    // LEVEL path — rolling window, asymmetric one-pole, per-band taus
    const tau = u > A.env[i] ? P.atk : P.dec;
    A.env[i] += (u - A.env[i]) * (1 - Math.exp(-dt / tau));

    // TRANSIENT path — fast envelope minus slow reference. A limiter
    // flattens level but it cannot flatten *change*, so this is the one
    // thing that still survives on a brickwalled master. Dividing by the
    // slow envelope makes it a relative flux, so a quiet hat reads as
    // hard a hit as a loud kick.
    const ft = u > A.fast[i] ? FAST_A : FAST_R;
    A.fast[i] += (u - A.fast[i]) * (1 - Math.exp(-dt / ft));
    A.slow[i] += (u - A.slow[i]) * kSlow;
    const flux = clamp((A.fast[i] - A.slow[i]) / (A.slow[i] + FLUX_K) * FLUX_G, 0, 1.5);
    A.fpk[i] = Math.max(flux, A.fpk[i] * fpkDec, FLUX_MIN);
    const trn = clamp(flux / A.fpk[i], 0, 1) * TRN_HEAD;   // hits punch into headroom

    // WINDOW — peak snaps up and relaxes down, valley snaps down and
    // relaxes up, so the band normalises between its own recent floor
    // and its own recent ceiling. The old code tracked only the peak
    // against a fixed 0.05 floor, which could pull a band down but
    // never open it back up, so a loud constant band stayed at 1.
    if (seeding) { A.peak[i] = A.val[i] = A.env[i]; }
    A.peak[i] = Math.max(A.env[i], A.peak[i] + (A.env[i] - A.peak[i]) * kPk);
    A.val[i] = Math.min(A.env[i], A.val[i] + (A.env[i] - A.val[i]) * kVal);

    // If the source is so limited that peak and valley have converged,
    // open the window symmetrically about its centre rather than letting
    // it collapse — a collapsed window maps a dead-constant band to 1.0,
    // which is exactly the pinning we are here to undo.
    let lo = A.val[i], hi = Math.max(A.peak[i], PK_MIN);
    if (hi - lo < SPAN_MIN) { const c = (hi + lo) * 0.5; lo = c - SPAN_MIN * 0.5; hi = c + SPAN_MIN * 0.5; }

    // Confidence: how far this band's ceiling sits above the noise
    // minimum. Without it the expander happily turns the hiss in an
    // empty band into full-scale motion, because relative to itself
    // hiss is as dynamic as a drum kit.
    const conf = clamp((hi - CONF_LO) / CONF_SPAN, 0, 1);
    const da = clamp(DYN, 0, 1) * conf;
    const nDyn = clamp((A.env[i] - lo) / (hi - lo), 0, 1);
    const nAbs = clamp(A.env[i] / Math.max(hi, PK_MIN), 0, 1);
    const nrm = nAbs + (nDyn - nAbs) * da;
    A.norm[i] = nrm;

    // EXPANSION — push the band's own distribution apart about its
    // running mean, which is precisely the inverse of what the mastering
    // limiter did to it. Makeup puts the mean at TARGET, below nominal,
    // so the peaks have somewhere to climb.
    // How much expansion a band gets depends on how squashed it already
    // is. A band that still has 12 dB of natural range gets a light touch;
    // one the limiter flattened to nothing gets the lot. That is what lets
    // a brickwalled MP3 come alive without wrecking a master that was
    // never crushed in the first place — the knob means "recover what was
    // taken", not "expand by this much regardless".
    const squash = clamp(1 - (A.peak[i] - A.val[i]) / OPEN_SPAN, 0, 1);
    if (seeding) A.avg[i] = nrm;              // no deviation to expand on frame one
    A.avg[i] += (nrm - A.avg[i]) * kAvg;
    const C = 1 + P.exp * DYN * conf * (SQ_FLOOR + (1 - SQ_FLOOR) * squash);
    const lvl = TARGET * conf + (nrm - A.avg[i]) * C;

    // blend the fader between following level and following change
    let x = lvl + (trn * conf - lvl) * P.trn;
    if (A.env[i] < P.thr) x = 0;              // gate: band goes quiet, plane stops
    A.inp[i] = clamp(x, 0, HEAD);
  }

  // harmonic coupling: a band sounding together with the one above it
  // is an overtone-rich source, so it reads hotter than a pure tone.
  // This is still the INPUT stage — it is what the white meter shows.
  for (let i = 0; i < 6; i++) {
    const up = Math.min(A.inp[Math.min(i + 1, 5)], 1);
    const coh = Math.sqrt(Math.min(A.inp[i], 1) * up);
    A.inp[i] = clamp(A.inp[i] * (1 + 0.7 * coh), 0, HEAD);
  }

  // TRANSFER stage — input is reshaped into an automation signal,
  // and only then does it reach the fader for its rotation plane.
  for (let i = 0; i < 6; i++) {
    const P = PARAMS[i];
    const x = clamp(A.inp[i] * P.pre, 0, HEAD);       // pre-drive, ceiling at HEAD
    const y = SHAPERS[P.fn].f(A.st[i], x, dt);
    A.out[i] = clamp(y * P.post, 0, CEIL);            // post-drive out to the fader
    PLANEDRIVE[BANDS[i].plane] = BANDS[i].dir * A.out[i] * DRIVE * A.gain;
  }
  paintMeters();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (AUDIO.on) audioStep(dt);
  if (S.playing) {
    for (let p = 0; p < 6; p++)
      if (S.planes[p]) S.ang[p] += dt * S.speed * RATE[p] * (AUDIO.on ? PLANEDRIVE[p] : 1);
  }
  draw();
  requestAnimationFrame(frame);
}

/* ============================================================
   Controls
   ============================================================ */
const el = id => document.getElementById(id);
const shapeIn = el("shape");
shapeIn.max = SHAPES.length - 1;

// pointer-driven sliders: native range drag is unreliable on touch, so drive it directly
function paint(input) {
  const wrap = input.closest(".slider");
  const min = +input.min, max = +input.max;
  const r = (+input.value - min) / (max - min);
  wrap.querySelector(".fill").style.width = (r * 100) + "%";
  wrap.querySelector(".knob").style.left = (r * 100) + "%";
}
function bindSlider(input, onChange) {
  const wrap = input.closest(".slider");
  const min = +input.min, max = +input.max, step = +input.step || 1;
  let active = false;

  const setFromX = clientX => {
    const rect = wrap.getBoundingClientRect();
    const r = clamp((clientX - rect.left) / rect.width, 0, 1);
    const raw = min + r * (max - min);
    const val = clamp(Math.round(raw / step) * step, min, max);
    if (val !== +input.value) { input.value = val; onChange(val); }
    paint(input);
  };

  // Axis lock. pointerdown does NOT claim the gesture: a vertical swipe that starts
  // on a fader has to reach #body and scroll the panel. The first movement past
  // LOCK px decides — horizontal captures the pointer and drives the value, vertical
  // abandons it. No movement at all is a tap, and a tap still jumps the value.
  const LOCK = 6;
  let pending = false, sx = 0, sy = 0, moved = false;

  wrap.addEventListener("pointerdown", e => {
    pending = true; active = false; moved = false;
    sx = e.clientX; sy = e.clientY;
    // focus is NOT taken here: pointerdown is no longer preventDefault-ed, so the
    // browser's own mousedown focus handling would immediately undo it. It is taken
    // once the gesture is claimed, or on the tap.
  });
  wrap.addEventListener("pointermove", e => {
    if (active) { setFromX(e.clientX); e.preventDefault(); return; }
    if (!pending) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < LOCK && Math.abs(dy) < LOCK) return;
    moved = true;
    if (Math.abs(dx) > Math.abs(dy)) {          // horizontal: this gesture is ours
      active = true;
      try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
      input.focus({ preventScroll: true });
      setFromX(e.clientX);
      e.preventDefault();
    } else {                                     // vertical: let #body scroll
      pending = false;
    }
  });
  const stop = e => {
    if (pending && !moved && !active) {                     // plain click / tap
      input.focus({ preventScroll: true });
      setFromX(e.clientX);
    }
    if (active) { try { wrap.releasePointerCapture(e.pointerId); } catch (_) {} }
    pending = false; active = false; moved = false;
  };
  wrap.addEventListener("pointerup", stop);
  wrap.addEventListener("pointercancel", () => {
    if (active) active = false;
    pending = false; moved = false;
  });

  // trackpad wheel: ~440 px of scroll sweeps the whole range. Deltas arrive as many
  // small fractions, so accumulate in step units and only apply whole steps.
  // Must be non-passive or the preventDefault that stops #body scrolling is ignored.
  // Horizontal only. A trackpad's "vertical" scroll always carries a little deltaX,
  // so a clear dominance ratio is required; anything else is left alone (no
  // preventDefault) and passes through to #body.
  const SWEEP = 440, LINE = 16, PAGE = 320, DOM = 2.5;
  let acc = 0, accT = -1e9;
  wrap.addEventListener("wheel", e => {
    const unit = e.deltaMode === 1 ? LINE : e.deltaMode === 2 ? PAGE : 1;
    const dx = e.deltaX * unit, dy = e.deltaY * unit;
    if (Math.abs(dx) < DOM * Math.abs(dy) || dx === 0) return;  // vertical → scroll the panel
    e.preventDefault();
    const d = dx;                                         // right increases
    if (e.timeStamp - accT > 250 || d * acc < 0) acc = 0; // new gesture, or reversal
    accT = e.timeStamp;
    acc += d * ((max - min) / step) / SWEEP;
    const n = Math.trunc(acc);
    if (!n) return;
    acc -= n;
    const val = clamp(+input.value + n * step, min, max);
    if (val !== +input.value) { input.value = val; onChange(val); paint(input); }
  }, { passive: false });
  // keyboard still uses the native input
  input.addEventListener("keydown", () => setTimeout(() => { onChange(+input.value); paint(input); }, 0));
  paint(input);
}

function syncShape() {
  const s = SHAPES[S.shape], g = geom(S.shape);
  el("cells").innerHTML = (s.cells || "∞") + "<sub>cells</sub>";
  el("name").textContent = s.name;
  el("alias").textContent = s.alias;
  el("schlafli").textContent = s.sym;
  el("counts").textContent = g.n + " vertices · " + g.m + " edges";
  el("shapePos").textContent = (S.shape + 1) + " / " + SHAPES.length;
  shapeIn.value = S.shape;
  paint(shapeIn);
}

bindSlider(shapeIn, v => { S.shape = v; syncShape(); });
bindSlider(el("bright"), v => { S.bright = v / 100; el("brightVal").textContent = S.bright.toFixed(2); });
bindSlider(el("speed"),  v => { S.speed  = v / 100; el("speedVal").textContent  = S.speed.toFixed(2); });

/* ---- audio UI ---- */
const meterEls = [];
const shaperSels = [];
let SELB = 0;                                   // band whose strip is open

// meter scale: full height is METER_TOP, and nominal (1.0) sits at NOM_PCT
const METER_TOP = 1.6;
const NOM_PCT = 100 / METER_TOP;                // 62.5%

const DEFAULT_HINT = 'Pick a band to tune its window and drive. ' +
                     'Hover a transfer to see what it does.';

/* ---- hint readout ----
   The readout is absolutely positioned above the console, so nothing it says
   can move a control — including the very row the pointer is resting on.
   It lights while the pointer is inside the audio module and goes dark when
   it leaves, which keeps the canvas clear the rest of the time.
   Where there is no hover at all (touch), taps light it and it self-dismisses. */
const hudEl = el("hint");
const NOHOVER = !(window.matchMedia && window.matchMedia("(hover:hover)").matches);
let hintRevert = 0, hintFade = 0;

function hint(html, hold) {
  clearTimeout(hintRevert); clearTimeout(hintFade);
  hudEl.innerHTML = html || DEFAULT_HINT;
  hudEl.classList.add("on");
  if (hold) hintFade = setTimeout(hideHint, 5000);
}
/* leaving one control for another inside the module: fall back to the default
   line, but only after a beat, so meter-to-meter travel does not flicker */
function hintIdle() {
  clearTimeout(hintRevert);
  hintRevert = setTimeout(() => { hudEl.innerHTML = DEFAULT_HINT; }, 70);
}
function hideHint() {
  clearTimeout(hintRevert); clearTimeout(hintFade);
  hudEl.classList.remove("on");
}

/* knob spec: how each parameter maps between slider integers and PARAMS */
const KNOBS = [
  { key: "exp",  label: "Contrast",   min: 0, max: 200, step: 5, scale: 100,
    fmt: v => "1:" + (1 + v / 100).toFixed(2),
    tip: "Upward expansion about this band's own running average. Louder-than-average gets louder, quieter gets quieter — the inverse of what the mastering limiter did. This is what pulls dynamics back out of a brickwalled track." },
  { key: "trn",  label: "Transient",  min: 0, max: 100, step: 5, scale: 100,
    fmt: v => v + "%",
    tip: "Blends the fader from following level toward following change — a fast envelope minus a slow one. A limiter flattens level but cannot flatten change, so this is where punch comes from on a squashed master. At 100% the plane only moves on hits." },
  { key: "pre",  label: "Pre-drive",  min: 0, max: 400, step: 5, scale: 100,
    fmt: v => (v / 100).toFixed(2) + "×",
    tip: "Gain into the transfer function. Nominal is 1.0 and the ceiling is 2.0, so there is a full 6 dB of headroom above nominal before anything flattens." },
  { key: "post", label: "Post-drive", min: 0, max: 400, step: 5, scale: 100,
    fmt: v => (v / 100).toFixed(2) + "×",
    tip: "Gain out of the transfer, straight to the rotation fader. This is how much this band contributes overall." },
  { key: "atk",  label: "Attack",     min: 2, max: 600, step: 2, scale: 1000,
    fmt: v => v + " ms",
    tip: "How fast the rolling window rises. Short catches transients; long ignores them and tracks the swell." },
  { key: "dec",  label: "Decay",      min: 20, max: 2500, step: 10, scale: 1000,
    fmt: v => (v >= 1000 ? (v / 1000).toFixed(2) + " s" : v + " ms"),
    tip: "How fast the window falls. This sets how long the band keeps driving after the sound stops." },
  { key: "thr",  label: "Threshold",  min: 0, max: 50, step: 1, scale: 100,
    fmt: v => (v / 100).toFixed(2),
    tip: "Gate. Below this the band outputs nothing and its rotation plane stops dead." }
];
const knobUI = [];

(function buildAudioUI() {
  const host = el("meters"), shost = el("shapers");

  BANDS.forEach((b, i) => {
    const m = document.createElement("div");
    m.className = "meter";
    m.innerHTML =
      '<div class="bar">' +
      '<div class="zone" style="height:' + (100 - NOM_PCT).toFixed(1) + '%"></div>' +
      '<div class="col"><div class="lvl"></div><div class="ovr" style="bottom:' + NOM_PCT.toFixed(1) + '%"></div></div>' +
      '<div class="col"><div class="hit"></div><div class="ovr" style="bottom:' + NOM_PCT.toFixed(1) + '%"></div></div>' +
      '<div class="nom" style="bottom:' + NOM_PCT.toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="tag">' + b.id + '</div><div class="pl">' + b.pl + '</div>';
    const bandTip = "<b>" + b.id + "</b> " + b.lo + "–" + b.hi + " Hz → " + b.pl +
                    " plane, " + (b.dir > 0 ? "forward" : "reverse") + ".";
    m.addEventListener("click", () => { selectBand(i); hint(bandTip, NOHOVER); });
    m.addEventListener("mouseover", () => hint(bandTip));
    m.addEventListener("mouseout", hintIdle);
    host.appendChild(m);
    const ov = m.querySelectorAll(".ovr");
    meterEls.push({
      el: m, lvl: m.querySelector(".lvl"), hit: m.querySelector(".hit"),
      inOvr: ov[0], outOvr: ov[1],
      inCol: ov[0].parentNode, outCol: ov[1].parentNode
    });

    const sel = document.createElement("select");
    SHAPERS.forEach((sh, k) => {
      const o = document.createElement("option");
      o.value = k; o.textContent = sh.tag; o.title = sh.name;
      sel.appendChild(o);
    });
    sel.value = PARAMS[i].fn;
    // no title= on the select itself: the readout already says this, and the
    // native tooltip would only shadow it. The options keep theirs, because
    // the open dropdown is a native popup the readout cannot reach.
    sel.setAttribute("aria-label", b.id + " band transfer function");
    const describe = hold => hint("<b>" + SHAPERS[PARAMS[i].fn].tag + "</b> " +
                                  SHAPERS[PARAMS[i].fn].name + " — driving " + b.pl + ".", hold);
    sel.addEventListener("mouseover", () => describe(false));
    sel.addEventListener("focus", () => describe(NOHOVER));
    sel.addEventListener("mouseout", hintIdle);
    sel.addEventListener("change", e => {
      PARAMS[i].fn = +e.target.value;
      AUDIO.st[i] = {};
      selectBand(i);
      describe(NOHOVER);
    });
    shost.appendChild(sel);
    shaperSels.push(sel);
  });

  // scene list
  const sc = el("scene");
  PRESETS.forEach((p, k) => {
    const o = document.createElement("option");
    o.value = k; o.textContent = p.name;
    sc.appendChild(o);
  });
  sc.addEventListener("change", e => {
    applyPreset(+e.target.value);
    refreshChain();
    say("Scene: " + PRESETS[+e.target.value].name);
  });

  // per-band strip
  const kh = el("knobs");
  KNOBS.forEach(spec => {
    const row = document.createElement("div");
    row.className = "krow";
    // no title= here: it duplicated the readout and arrived a second late
    row.innerHTML =
      '<label class="cap"><span>' + spec.label + '</span><b>–</b></label>' +
      '<div class="slider"><div class="track"></div><div class="fill"></div><div class="knob"></div>' +
      '<input type="range" min="' + spec.min + '" max="' + spec.max + '" step="' + spec.step + '"></div>';
    const input = row.querySelector("input"), read = row.querySelector("b");
    const rowTip = "<b>" + spec.label + "</b> " + spec.tip;
    input.setAttribute("aria-label", spec.label + ". " + spec.tip);
    row.addEventListener("mouseover", () => hint(rowTip));
    row.addEventListener("mouseout", hintIdle);
    // touch has no hover, so grabbing the fader is what surfaces the tip
    row.addEventListener("pointerdown", e => hint(rowTip, e.pointerType !== "mouse"));
    bindSlider(input, v => {
      PARAMS[SELB][spec.key] = v / spec.scale;
      read.textContent = spec.fmt(v);
    });
    kh.appendChild(row);
    knobUI.push({ spec, input, read });
  });

  // the readout belongs to the audio module: it lights on entry, reverts to the
  // default line over blank space inside it, and goes dark on the way out
  const arow = el("audioRow");
  arow.addEventListener("mouseover", e => {
    if (!e.target.closest(".meter, .shapers select, .krow")) hint(null);
  });
  arow.addEventListener("mouseleave", hideHint);
  el("console").addEventListener("mouseleave", hideHint);

  selectBand(0);
  hudEl.innerHTML = DEFAULT_HINT;      // primed, but dark until something asks for it
})();

function selectBand(i) {
  SELB = i;
  meterEls.forEach((m, k) => m.el.classList.toggle("sel", k === i));
  el("stripName").textContent = BANDS[i].id + " · " + SHAPERS[PARAMS[i].fn].tag;
  el("stripPlane").textContent = BANDS[i].lo + "–" + BANDS[i].hi + " Hz → " + BANDS[i].pl;
  for (const k of knobUI) {
    k.input.value = Math.round(PARAMS[i][k.spec.key] * k.spec.scale);
    k.read.textContent = k.spec.fmt(+k.input.value);
    paint(k.input);
  }
}

// re-sync every control after a scene change
function refreshChain() {
  shaperSels.forEach((sel, i) => { sel.value = PARAMS[i].fn; });
  selectBand(SELB);
}

/* The meter reads 0..METER_TOP with nominal at 1.0, so the bars sit
   around two thirds height when a band is working normally and the
   red above the nominal line is genuine headroom being used. Six bars
   glued to the ceiling used to mean "no idea how hard this is
   pushing"; now the ceiling is somewhere you visibly reach. */
function paintMeters() {
  const A = AUDIO;
  for (let i = 0; i < 6; i++) {
    const m = meterEls[i], iv = A.inp[i], ov = A.out[i];
    m.lvl.style.height = (Math.min(iv, 1) / METER_TOP * 100).toFixed(1) + "%";
    m.hit.style.height = (Math.min(ov, 1) / METER_TOP * 100).toFixed(1) + "%";
    m.inOvr.style.height = (clamp(iv - 1, 0, METER_TOP - 1) / METER_TOP * 100).toFixed(1) + "%";
    m.outOvr.style.height = (clamp(ov - 1, 0, METER_TOP - 1) / METER_TOP * 100).toFixed(1) + "%";
    m.inCol.classList.toggle("over", iv > METER_TOP);     // pinned against the top
    m.outCol.classList.toggle("over", ov > METER_TOP);
  }
}
function clearMeters() {
  for (const m of meterEls) {
    m.lvl.style.height = "0%"; m.hit.style.height = "0%";
    m.inOvr.style.height = "0%"; m.outOvr.style.height = "0%";
    m.inCol.classList.remove("over"); m.outCol.classList.remove("over");
  }
}

function say(text, isErr) {
  const n = el("audioMsg");
  n.textContent = text;
  n.classList.toggle("err", !!isErr);
}

/* ---- sources: microphone, or a local audio file ----
   The file is read straight into an ArrayBuffer and decoded by the
   AudioContext. No <audio> element and no blob: URL, because embedded
   previews serve a CSP with no media-src, which blocks blob media. ---- */
let fileSrc = null;

/* ---- transport ----
   An AudioBufferSourceNode is single-use: once stopped it can never be
   started again. So pause stops the node and remembers the playhead, and
   resume builds a fresh source started at that offset. Position is read
   off ac.currentTime rather than counted per frame, so it stays exact
   while the tab is throttled; the modulo folds loop wraps back in.

   Analysis deliberately keeps running while paused — the hub is fed by
   nothing, which is silence, so the band envelopes decay to zero on their
   own time constants and the shape coasts to a stop instead of freezing. */
const TR = { buf: null, hub: null, playing: false, offset: 0, since: 0 };

function trPos() {
  if (!TR.buf) return 0;
  const d = TR.buf.duration;
  if (!TR.playing || !AUDIO.ctx || d <= 0) return TR.offset;
  return (TR.offset + (AUDIO.ctx.currentTime - TR.since)) % d;
}

function trStart(off) {
  const ac = AUDIO.ctx;
  if (!ac || !TR.buf) return;
  const src = ac.createBufferSource();
  src.buffer = TR.buf;
  src.loop = true;
  src.connect(TR.hub);
  src.start(0, off);
  fileSrc = src;
  TR.offset = off; TR.since = ac.currentTime; TR.playing = true;
  syncTransport();
}

function trStop() {
  if (fileSrc) {
    try { fileSrc.stop(); } catch (_) {}
    try { fileSrc.disconnect(); } catch (_) {}
    fileSrc = null;
  }
}

function trPause() {
  if (!TR.playing) return;
  TR.offset = trPos();
  TR.playing = false;
  trStop();
  syncTransport();
}

function trToggle() {
  if (!TR.buf) return;
  if (TR.playing) trPause();
  else { AUDIO.ctx.resume(); trStart(TR.offset); }
}

// return to zero, keeping whatever transport state you were in — a DAW
// that started playing every time you hit the start marker would be rude
function trRestart() {
  if (!TR.buf) return;
  if (TR.playing) { trStop(); trStart(0); }
  else { TR.offset = 0; syncTransport(); }
}

const mmss = s => {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};

function syncTransport() {
  const live = !!TR.buf, t = el("trTime");
  el("trPlay").disabled = !live;
  el("trRestart").disabled = !live;
  el("trPlay").innerHTML = TR.playing
    ? '<span class="g">&#10074;&#10074;</span>Pause'
    : '<span class="g">&#9654;</span>Play';
  t.classList.toggle("off", !live);
  t.textContent = live ? mmss(trPos()) + " / " + mmss(TR.buf.duration) : "0:00 / 0:00";
}
setInterval(() => { if (TR.buf && TR.playing) syncTransport(); }, 250);

el("trPlay").addEventListener("click", trToggle);
el("trRestart").addEventListener("click", trRestart);

function attach(ac, node, label) {
  const an = ac.createAnalyser();
  an.fftSize = 4096;
  an.smoothingTimeConstant = 0.15;      // the envelopes below do the smoothing
  node.connect(an);

  const nyq = ac.sampleRate / 2, bins = an.frequencyBinCount;
  AUDIO.binLo = []; AUDIO.binHi = [];
  for (const b of BANDS) {
    AUDIO.binLo.push(Math.max(1, Math.floor(b.lo / nyq * bins)));
    AUDIO.binHi.push(Math.min(bins - 1, Math.max(2, Math.ceil(b.hi / nyq * bins))));
  }
  AUDIO.ctx = ac; AUDIO.an = an; AUDIO.freq = new Float32Array(bins);
  AUDIO.env.fill(0); AUDIO.fast.fill(0); AUDIO.slow.fill(0);
  AUDIO.fpk.fill(0.2); AUDIO.peak.fill(0.25); AUDIO.val.fill(0.25);
  AUDIO.avg.fill(0.5); AUDIO.norm.fill(0); AUDIO.warm = 0;
  AUDIO.inp.fill(0); AUDIO.out.fill(0);
  AUDIO.st = [{}, {}, {}, {}, {}, {}];
  AUDIO.on = true;

  for (let p = 0; p < 6; p++) {
    S.planes[p] = true;
    el("planes").querySelector('[data-p="' + p + '"]').setAttribute("aria-pressed", "true");
  }
  el("audioRow").classList.remove("idle");
  say(label + " · " + Math.round(ac.sampleRate / 1000) + " kHz · " + (nyq / bins).toFixed(1) + " Hz per bin");
}

function newCtx() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  return ac;
}

function diagnose(err) {
  const name = err && err.name ? err.name : "unknown";
  const local = location.protocol === "file:";
  if (local)
    return "Blocked (" + name + "). Chrome refuses microphone access on file:// pages. " +
           "Use Firefox, or serve the folder over localhost, or load a track instead.";
  if (!window.isSecureContext)
    return "Blocked (" + name + "). The page is not a secure context — the microphone needs https or localhost.";
  if (name === "NotAllowedError")
    return "Permission denied. Check the mic icon in the address bar, or use Load a track.";
  if (name === "NotFoundError")
    return "No input device found. Plug in a microphone, or use Load a track.";
  return "Microphone unavailable (" + name + "). Try Load a track.";
}

async function startMic() {
  stopAudio(true);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say(location.protocol === "file:"
      ? "No microphone API on file:// pages. Serve over localhost, or load a track."
      : "This browser exposes no microphone API. Load a track instead.", true);
    return;
  }
  say("Requesting microphone…");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const ac = newCtx();
    AUDIO.stream = stream;
    AUDIO.mode = "mic";
    attach(ac, ac.createMediaStreamSource(stream), "Microphone");
    el("tMic").setAttribute("aria-pressed", "true");
  } catch (err) {
    AUDIO.on = false;
    el("tMic").setAttribute("aria-pressed", "false");
    say(diagnose(err), true);
  }
}

function startFile(file) {
  stopAudio(true);
  say("Decoding " + file.name.slice(0, 24) + "…");
  let ac;
  try { ac = newCtx(); }
  catch (err) { say("No audio engine available here (" + (err && err.name) + ").", true); return; }

  const rd = new FileReader();
  rd.onerror = () => say("Could not read that file.", true);
  rd.onload = () => {
    ac.decodeAudioData(rd.result, buf => {
      // every source node feeds one fixed hub, so pause/resume can swap
      // sources underneath without ever re-wiring the analyser
      const hub = ac.createGain();
      hub.connect(ac.destination);          // so you hear it as well as see it
      AUDIO.mode = "file";
      attach(ac, hub, file.name.slice(0, 20));
      TR.buf = buf; TR.hub = hub; TR.offset = 0;
      trStart(0);
      el("tFile").setAttribute("aria-pressed", "true");
    }, () => {
      try { ac.close(); } catch (_) {}
      say("Could not decode that file. MP3, WAV, M4A and OGG all work.", true);
    });
  };
  rd.readAsArrayBuffer(file);
}

function stopAudio(quiet) {
  if (AUDIO.stream) AUDIO.stream.getTracks().forEach(t => t.stop());
  if (fileSrc) { try { fileSrc.stop(); } catch (_) {} fileSrc = null; }
  TR.buf = null; TR.hub = null; TR.playing = false; TR.offset = 0;
  syncTransport();
  if (AUDIO.ctx) { try { AUDIO.ctx.close(); } catch (_) {} }
  AUDIO.on = false; AUDIO.ctx = null; AUDIO.an = null; AUDIO.stream = null; AUDIO.mode = null;
  PLANEDRIVE.fill(1);
  clearMeters();
  el("audioRow").classList.add("idle");
  el("tMic").setAttribute("aria-pressed", "false");
  el("tFile").setAttribute("aria-pressed", "false");
  if (!quiet) say("Stopped. Rotation is back on the speed slider.");
}

const toggleMic = () => (AUDIO.on && AUDIO.mode === "mic" ? stopAudio() : startMic());
el("tMic").addEventListener("click", toggleMic);
el("fileIn").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (f) startFile(f);
  e.target.value = "";
});
bindSlider(el("drive"), v => { AUDIO.gain = v / 100; el("driveVal").textContent = AUDIO.gain.toFixed(2); });
bindSlider(el("dyn"), v => { AUDIO.dyn = v / 100; el("dynVal").textContent = AUDIO.dyn.toFixed(2); });

el("planes").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const p = +b.dataset.p;
  S.planes[p] = !S.planes[p];
  b.setAttribute("aria-pressed", S.planes[p]);
});

const togglePoints = () => { S.points = !S.points; el("tPoints").setAttribute("aria-pressed", S.points); };
const togglePlay   = () => { S.playing = !S.playing; el("tPlay").setAttribute("aria-pressed", S.playing); };
el("tPoints").addEventListener("click", togglePoints);
el("tPlay").addEventListener("click", togglePlay);

// collapse the console downward, leaving only the handle
const cons = el("console"), handle = el("handle");
function toggleConsole() {
  const collapsed = cons.classList.toggle("collapsed");
  handle.setAttribute("aria-expanded", String(!collapsed));
  hideHint();
}
handle.addEventListener("click", toggleConsole);

// drag to turn the 3D view
let drag = null;
cv.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY };
  cv.setPointerCapture(e.pointerId);
  cv.classList.add("dragging");
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  S.yaw += (e.clientX - drag.x) * 0.008;
  S.pitch = clamp(S.pitch + (e.clientY - drag.y) * 0.008, -1.5, 1.5);
  drag = { x: e.clientX, y: e.clientY };
});
const endDrag = () => { drag = null; cv.classList.remove("dragging"); };
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (e.target.tagName === "SELECT") return;
  const inField = e.target.tagName === "INPUT";
  if (inField && (k === "arrowleft" || k === "arrowright" || k === "arrowup" || k === "arrowdown")) return;
  if (k === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "p") togglePoints();
  else if (k === "h") toggleConsole();
  else if (k === "m") toggleMic();
  else if (k === "k") trToggle();
  else if (k === "0") trRestart();
  else if (k === "r") { S.yaw = 0; S.pitch = 0; S.ang = [0, 0, 0, 0, 0, 0]; }
  else if (k === "arrowright") { S.shape = Math.min(SHAPES.length - 1, S.shape + 1); syncShape(); }
  else if (k === "arrowleft")  { S.shape = Math.max(0, S.shape - 1); syncShape(); }
});

// tell the user up front whether the mic can work here at all
(function probeAudio() {
  const framed = window.self !== window.top;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say(location.protocol === "file:"
      ? "Mic unavailable on file:// pages. Use Load a track, or serve over localhost."
      : "No microphone API here. Use Load a track.", true);
  } else if (framed) {
    say("Embedded previews block the mic. Load a track here, or open the file in a browser for mic input.");
  }
})();

resize();
syncShape();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
</html>
