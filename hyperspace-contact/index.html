<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperspace</title>
<meta name="description" content="Hyperspace — a real-time 4D polytope visualizer.">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --red: #ff2b2b;
    --dim: rgba(255, 255, 255, .42);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
  body {
    font-family: var(--mono);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 48px 16px;
  }
  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--red);
  }
  ul { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 320px; display: grid; gap: 12px; }
  a {
    display: block;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 6px;
    color: #fff;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    transition: color .15s, border-color .15s;
  }
  a:hover, a:focus-visible { border-color: var(--red); color: var(--red); outline: none; }
  img { width: 200px; height: 200px; border-radius: 6px; image-rendering: pixelated; }
  footer { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  a.plain { padding: 0; border: 0; border-radius: 0; font-size: 12px; color: var(--dim); }
  a.plain:hover, a.plain:focus-visible { color: var(--red); }
</style>
</head>
<body>
  <h1>Hyperspace</h1>

  <ul>
    <li><a href="https://www.instagram.com/dr_allman/">@dr_allman</a></li>
    <li><a href="https://www.instagram.com/dilloncutaiar/">@dilloncutaiar</a></li>
  </ul>

  <img src="qr.svg" alt="QR code linking to hyperspace-contact.cutaiar.io">

  <footer>
    <a class="plain" href="https://hyperspace-contact.cutaiar.io">hyperspace-contact.cutaiar.io</a>
    <a class="plain" href="https://github.com/Cutaiar/hyperspace">github.com/Cutaiar/hyperspace</a>
  </footer>
</body>
</html>
