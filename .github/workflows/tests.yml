# The Python app's lint and fast test tier on every pull request and every
# push to main (hyperspace-python/docs/ENGINEERING.md §16, "CI"). Two jobs,
# named so a ruleset on main can require them by name:
#
# - `tests-macos`: the platform the app ships on — SF Rounded and SF Mono,
#   Apple's GL, the macOS-only wheels (mlx, pyobjc, Syphon).
# - `tests`: Linux, GL through Mesa's software rasteriser under Xvfb; it
#   catches what only holds on a Mac.
#
# Neither has the Ultraleap SDK or the M3 Max, so `hands` is left out and
# the golden frames skip. Public repository: standard runners cost nothing.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hyperspace-python
    env:
      # no Ultraleap SDK to build leapc-cffi against, and Linux torch wheels
      # pull gigabytes of CUDA no fast-tier test imports (pyproject's groups)
      UV_NO_GROUP: hands dream
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        # ALSA headers to build python-rtmidi; PortAudio for sounddevice's
        # import; Mesa + Xvfb for GL and GLFW; libgl-dev for the unversioned
        # libGL.so moderngl's loader opens; DejaVu, the fonts ui.py falls
        # back to off the Mac; glslang, the reference compiler test_patterns
        # holds the face shaders to
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libportaudio2 libgl-dev libgl1-mesa-dri libglx-mesa0 \
            libegl1 xvfb xauth fonts-dejavu-core glslang-tools

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: hyperspace-python/uv.lock

      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Fast tier
        # --timeout: a hung test fails and names itself; a crashed worker
        # fails the run at once (xdist's replacement worker can stall the
        # loadgroup scheduler at 99 %)
        run: >
          xvfb-run -a -s "-screen 0 1920x1080x24"
          uv run pytest -q -rs --timeout 120 --max-worker-restart=0 --durations=20

  tests-macos:
    name: tests-macos
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: hyperspace-python
    env:
      # no Ultraleap SDK; torch only serves the slow tier
      UV_NO_GROUP: hands dream
    steps:
      - uses: actions/checkout@v5

      - name: System tools
        # glslang, the reference compiler test_patterns holds the face
        # shaders to (PortAudio and CoreMIDI come with the wheels)
        run: brew install glslang

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: hyperspace-python/uv.lock

      - name: Sync
        run: uv sync --locked

      - name: GL
        # what the GL tests draw on here (a VM's GPU, not the M3 Max)
        run: >
          uv run python -c "import moderngl;
          c = moderngl.create_context(standalone=True);
          print(c.info['GL_RENDERER'], c.info['GL_VERSION'])"

      - name: Fast tier
        run: uv run pytest -q -rs --timeout 120 --max-worker-restart=0 --durations=20
