<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20">
  <title>Hyperspace control model — who may write a parameter</title>
  <desc>Scene-setters write the base; exactly one performer row writes an offset through Router.modulate; Registry.apply lands base plus offset on the live object once per frame; the render stack only reads. Text twin in docs/ARCHITECTURE.md §3.2.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1272d"/>
    </marker>
  </defs>
  <rect width="900" height="900" fill="#fff"/>

  <!-- scene-setters -->
  <rect x="20" y="20" width="420" height="230" rx="12" fill="#f3f3f3" stroke="#bbb"/>
  <text x="36" y="52" font-weight="700" font-size="22">Scene-setters</text>
  <text x="36" y="80" font-weight="700" font-size="18">write the BASE · never prompt, never blocked</text>
  <text x="36" y="116">panel widgets</text>
  <text x="36" y="142">key / pad rows → routing.act</text>
  <text x="36" y="168">APC40 knobs, faders, buttons</text>
  <text x="36" y="194">presets, themes, projects → restore</text>
  <text x="36" y="220">mouse, sticks, ↑/↓ → nudge / scale</text>
  <text x="36" y="246" fill="#555" font-size="17">every path ends in Param.set → _base</text>

  <!-- performer -->
  <rect x="460" y="20" width="420" height="230" rx="12" fill="#fbecec" stroke="#c1272d"/>
  <text x="476" y="52" font-weight="700" font-size="22" fill="#c1272d">The one performer</text>
  <text x="476" y="80" font-weight="700" font-size="18" fill="#c1272d">writes an OFFSET · one row per target</text>
  <text x="476" y="116">lane:i · hand:i · ext:i · lfo:i</text>
  <text x="476" y="146" font-family="Menlo, Consolas, monospace" font-size="17">push: depth·scale·(u − rest)</text>
  <text x="476" y="172" font-family="Menlo, Consolas, monospace" font-size="17">position: clamp(depth·scale·u) − base</text>
  <text x="476" y="204">Router.modulate → Param.modulate</text>
  <text x="476" y="232" fill="#555" font-size="17">a second row → Owned → Replace / Keep</text>

  <!-- arrows in -->
  <line x1="230" y1="250" x2="390" y2="360" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="250" y="322" font-weight="700">base</text>
  <line x1="670" y1="250" x2="510" y2="360" stroke="#c1272d" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="600" y="322" font-weight="700" fill="#c1272d">offset</text>

  <!-- param -->
  <rect x="200" y="360" width="500" height="150" rx="12" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="450" y="396" text-anchor="middle" font-weight="700" font-size="24">Param</text>
  <text x="450" y="432" text-anchor="middle" font-size="22">base  +  Σ offsets  →  effective</text>
  <text x="450" y="464" text-anchor="middle" fill="#555" font-size="17">Registry.apply(), once a frame, after every source has spoken</text>
  <text x="450" y="490" text-anchor="middle" fill="#555" font-size="17">a direct object write since last frame is folded into the base first</text>

  <!-- object -->
  <line x1="450" y1="510" x2="450" y2="600" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="464" y="562">put(effective)</text>
  <rect x="200" y="600" width="500" height="100" rx="12" fill="#f3f3f3" stroke="#bbb"/>
  <text x="450" y="638" text-anchor="middle" font-weight="700" font-size="22">The live object</text>
  <text x="450" y="672" text-anchor="middle" font-size="18">ViewState · FxState · DreamState · Analyzer · Output</text>

  <!-- object writers -->
  <rect x="20" y="740" width="410" height="140" rx="12" fill="#fff" stroke="#bbb" stroke-dasharray="6 5"/>
  <text x="36" y="772" font-weight="700">Object writers (bypass Param)</text>
  <text x="36" y="802">ViewState.integrate → ang</text>
  <text x="36" y="828">camera.reset · Control resets</text>
  <text x="36" y="862" fill="#555" font-size="17">folded into the base next frame</text>
  <line x1="225" y1="740" x2="330" y2="700" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- readers -->
  <rect x="470" y="740" width="410" height="140" rx="12" fill="#fff" stroke="#bbb" stroke-dasharray="6 5"/>
  <text x="486" y="772" font-weight="700">Readers (never write)</text>
  <text x="486" y="802">Renderer · Lookback · FxChain</text>
  <text x="486" y="828">LFO.step (own fields) · bridge out</text>
  <text x="486" y="862" fill="#555" font-size="17">see last frame's value — the one-frame lag</text>
  <line x1="570" y1="700" x2="675" y2="740" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
