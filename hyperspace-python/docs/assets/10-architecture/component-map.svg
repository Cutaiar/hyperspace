<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="19">
  <title>Hyperspace component map</title>
  <desc>Input adapters and sources feed the routing table; the router writes offsets into the registry; the control window writes bases; the registry lands base plus offsets on the live objects once a frame; the render stack only reads. Text twin: the table in docs/ARCHITECTURE.md §1.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1272d"/>
    </marker>
  </defs>
  <rect width="900" height="790" fill="#fff"/>

  <!-- input adapters -->
  <rect x="20" y="20" width="440" height="206" rx="12" fill="#f3f3f3" stroke="#bbb"/>
  <text x="36" y="50" font-weight="700" font-size="21">Input adapters</text>
  <text x="36" y="80">keys, mouse — app.Keys / app.Mouse</text>
  <text x="36" y="106">gamepad.Pad</text>
  <text x="36" y="132">midi.MidiIO + the apc40 profile</text>
  <text x="36" y="158">hands/ — HandsIO</text>
  <text x="36" y="184">bridge.Bridge</text>
  <text x="36" y="212" fill="#555" font-size="16">rows and knobs → base · hands, bridge → feed</text>

  <!-- sources -->
  <rect x="480" y="20" width="400" height="206" rx="12" fill="#f3f3f3" stroke="#bbb"/>
  <text x="496" y="50" font-weight="700" font-size="21">Sources that are not inputs</text>
  <text x="496" y="80">audio.AudioEngine → analyzer.Analyzer</text>
  <text x="496" y="106">lfo.LFOs + tempo.Clock</text>
  <text x="496" y="212" fill="#555" font-size="16">lanes and feed only — never a base write</text>

  <!-- arrows into the router -->
  <line x1="240" y1="226" x2="240" y2="280" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="252" y="262" font-size="17">rows → base · feed</text>
  <line x1="680" y1="226" x2="680" y2="280" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="692" y="262" font-size="17">feed</text>

  <!-- router -->
  <rect x="20" y="280" width="860" height="86" rx="12" fill="#fbecec" stroke="#c1272d" stroke-width="2"/>
  <text x="450" y="314" text-anchor="middle" font-weight="700" font-size="21" fill="#c1272d">routing.Router — the binding table</text>
  <text x="450" y="346" text-anchor="middle" font-size="18">Router.modulate — the one path a continuous source has to a parameter: an offset per row</text>

  <!-- router → registry -->
  <line x1="300" y1="366" x2="300" y2="420" stroke="#c1272d" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="312" y="402" font-size="17" fill="#c1272d">modulate → offset</text>

  <!-- registry -->
  <rect x="20" y="420" width="560" height="96" rx="12" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="300" y="456" text-anchor="middle" font-weight="700" font-size="22">params.Registry</text>
  <text x="300" y="490" text-anchor="middle">base + Σ offsets → the live objects, once a frame (apply)</text>

  <!-- control window -->
  <rect x="610" y="392" width="270" height="152" rx="12" fill="#f3f3f3" stroke="#bbb"/>
  <text x="626" y="422" font-weight="700" font-size="21">Control window</text>
  <text x="626" y="452">ui.Panel + the pages</text>
  <text x="626" y="478">control.Control</text>
  <text x="626" y="504">library.Library</text>
  <text x="626" y="532" fill="#555" font-size="16">set, restore → base · edits rows</text>
  <line x1="610" y1="468" x2="580" y2="468" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="745" y1="392" x2="745" y2="366" stroke="#333" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 4"/>

  <!-- registry → render -->
  <line x1="300" y1="516" x2="300" y2="570" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="312" y="552" font-size="17">apply() writes the objects</text>

  <!-- render stack -->
  <rect x="20" y="570" width="560" height="146" rx="12" fill="#f3f3f3" stroke="#bbb"/>
  <text x="36" y="600" font-weight="700" font-size="21">Render stack — reads only</text>
  <text x="36" y="630">render.ViewState → render.Renderer</text>
  <text x="36" y="656">geometry · fx · lookback · dream</text>
  <text x="36" y="682">overlay.Output — where the render window is</text>
  <text x="36" y="708" fill="#555" font-size="16">nothing here touches a Param</text>

  <!-- footnote -->
  <text x="20" y="756" fill="#555" font-size="16">MIDI ring feedback reads the base back out of the registry. app.py builds all of this once and runs the loop (§2).</text>
</svg>
