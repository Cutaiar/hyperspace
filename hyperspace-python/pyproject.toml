[project]
name = "hyperspace"
version = "0.1.0"
description = "Real-time 4D polytope visualizer — Python engine (see docs/BLUEPRINT.md)"
requires-python = ">=3.12"
dependencies = [
    # Ultraleap hands (hyperspace/hands): the SDK's own Python wrapper. Pure
    # Python over the prebuilt cffi module the Ultraleap Hand Tracking app
    # ships for 3.12 (…/LeapSDK/leapc_cffi); cffi is that module's runtime.
    # Imported only when [hands] is enabled. Not on PyPI: [tool.uv.sources].
    "cffi>=1.17",
    "leap",
    "glfw>=2.10.2",
    "imgui-bundle>=1.92.900",
    "mido>=1.3.3",
    "moderngl>=5.12.0",
    "numpy>=2.0",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pyopengl>=3.1.10",
    "pillow>=10",
    "python-rtmidi>=1.5.8",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
# the look-back's dream worker (dream.py, torch on MPS) and the bench in
# tools/dream_bench/. Optional: dream.py is imported only under
# `[dream] enabled` in config.toml.  `uv sync --extra dream`
dream = [
    "torch>=2.2",
    "torchvision>=0.17",
    "mlx>=0.20 ; sys_platform == 'darwin'",
    "pyobjc-framework-metal>=12.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyperspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy face-extraction tests (~seconds each)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[project.scripts]
hyperspace = "hyperspace.app:main"

[tool.uv.sources]
# Ultraleap's Python wrapper, pinned by commit (see the dependency's note)
leap = { git = "https://github.com/ultraleap/leapc-python-bindings", rev = "2341c6c3db5dc08236bb52890d8c43a224139694", subdirectory = "leapc-python-api" }
