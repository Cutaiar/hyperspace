[project]
name = "hyperspace"
version = "0.1.0"
description = "Real-time 4D polytope visualizer — Python engine (see docs/ARCHITECTURE.md)"
requires-python = ">=3.12"
dependencies = [
    # Ultraleap hands (hyperspace/hands): the SDK's own Python wrapper
    # (`leap`, pure Python) over the cffi module it binds (`leapc_cffi`),
    # built here at `uv sync` from vendor/leapc-cffi: upstream's package at
    # the same pinned commit, patched to build against whichever Gemini is
    # installed (libLeapC 5 or 6; see vendor/leapc-cffi/VENDORED.md). The
    # Hand Tracking app also ships a leapc_cffi, but an older app's is built
    # for 3.8 and will not import under this project's 3.12 — ours is found
    # first on sys.path (leap appends the app's folder, never prepends it).
    # cffi is the built module's runtime. Imported only when [hands] is
    # enabled. Neither is on PyPI: [tool.uv.sources].
    "cffi>=1.17",
    "leap",
    "leapc-cffi",
    "glfw>=2.10.2",
    "imgui-bundle>=1.92.900",
    "mido>=1.3.3",
    "moderngl>=5.12.0",
    "numpy>=2.0",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pyopengl>=3.1.10",
    "pillow>=10",
    "python-rtmidi>=1.5.8",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    # the look-back's dream worker (dream.py, torch on MPS) and the bench in
    # tools/dream_bench/ — part of the app since decision 23 (a), 2026-09-29:
    # plain `uv sync` installs it. dream.py is still imported lazily, only
    # under `[dream] enabled` (on by default), so importing app pulls no torch.
    "torch>=2.2",
    "torchvision>=0.17",
    "mlx>=0.20 ; sys_platform == 'darwin'",
    "pyobjc-framework-metal>=12.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2 ; sys_platform == 'darwin'",
    # wired Xbox 360 pads (gamepad.UsbPad): not HID, so macOS and GLFW
    # never see one — read over libusb, which libusb-package bundles
    "pyusb>=1.3.1",
    "libusb-package>=1.0.30.0",
    # OSC devices (osc.py, plan 27 B4): a phone app or any OSC sender as a
    # `[[devices]] kind = "osc"` entry. Pure Python; imported only when such
    # an entry opens, so importing app pulls none of it
    "python-osc>=1.8",
    # media sources (hyperspace/media, plan 32): each adapter library is
    # imported only inside the function that opens a source, so importing
    # app pulls none of them. av = video files (PyAV, bundles FFmpeg)
    "av>=19",
    # HEIC/HEIF stills, registered with Pillow inside the decode job
    "pillow-heif>=1.8",
    # Syphon clients (macOS only); [opengl] is the client/server the GL
    # texture path needs
    "syphon-python[opengl]>=0.2 ; sys_platform == 'darwin'",
    # NDI receive (cyndilib; pulls pugixml-cython)
    "cyndilib>=0.1.3",
    # camera enumeration by name (AVFoundation device list)
    "pyobjc-framework-avfoundation ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "playwright>=1.49",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyperspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tiers (tests/conftest.py applies the markers by name): a bare `pytest` runs
# the fast tier in parallel; `pytest --all` runs everything; -n0 = serial.
addopts = "-n auto --dist loadgroup -m 'not golden and not slow and not live'"
markers = [
    "golden: golden-frame draws (tests/test_golden_frames.py), ~45 s together",
    "slow: ~1 s or more each (torch dream, undo, plan 12 presets, whole-library sweeps)",
    "live: Syphon / NDI / real-file loopbacks with timeouts, flaky under load",
    "empty_frame: a bare Renderer keeps the app's empty frame (plan 36 T3)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor/"]   # upstream code, kept in upstream's style

[project.scripts]
hyperspace = "hyperspace.app:main"

[tool.uv]
# The interpreter is uv's own, not whatever Python the machine happens to
# have (.python-version pins the series, 3.14). A python.org framework
# build ships no CA bundle until its Install Certificates.command is run,
# and the dream's first-use weights download then dies in urllib with
# CERTIFICATE_VERIFY_FAILED; uv's builds use the system store. 3.15 is not
# reachable yet: torch publishes no cp315 wheel. requires-python stays
# >=3.12 (and ruff's target with it) — the package still runs there; this
# only fixes what a sync builds the venv on.
python-preference = "managed"

[tool.uv.sources]
# Ultraleap's Python wrapper, pinned by commit (see the dependency's note)
leap = { git = "https://github.com/ultraleap/leapc-python-bindings", rev = "2341c6c3db5dc08236bb52890d8c43a224139694", subdirectory = "leapc-python-api" }
# Its cffi module, vendored at that commit and patched (vendor/leapc-cffi/VENDORED.md)
leapc-cffi = { path = "vendor/leapc-cffi", editable = false }
